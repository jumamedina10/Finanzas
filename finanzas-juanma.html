// ── Editable inline field ──────────────────────────────────────
function Editable({ value, onSave, color, type="number" }) {
  const clr = color || C.primary;
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  if (editing) return (
    <input autoFocus type={type} value={val}
      onChange={e => setVal(e.target.value)}
      onBlur={() => { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); }}
      onKeyDown={e => { if (e.key==="Enter") { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); } }}
      style={{ width:type==="text"?120:80, background:C.bgDeep, border:`1px solid ${C.primary}`, borderRadius:5, padding:"2px 6px", color:C.text, fontFamily:"inherit", fontSize:"inherit" }} />
  );
  return (
    <span onClick={() => { setVal(value); setEditing(true); }} style={{ cursor:"pointer", borderBottom:`1px dashed ${C.textDim}`, color:clr }}>
      {typeof value==="number" ? value.toFixed(2) : value}
    </span>
  );
}

// ── Expense row ────────────────────────────────────────────────

// ── DonutChart ─────────────────────────────────────────────────
function DonutChart({ data, size=180, thickness=36 }) {
  const total = data.reduce((a,d)=>a+d.value,0);
  if (total===0) return null;
  const cx = size/2, cy = size/2, r = (size - thickness)/2;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const slices = data.map(d => {
    const pct = d.value / total;
    const dash = pct * circumference;
    const gap = circumference - dash;
    const slice = { ...d, dash, gap, offset, pct };
    offset += dash;
    return slice;
  });
  return (
    <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
      {slices.map((s,i) => (
        <circle key={i} cx={cx} cy={cy} r={r}
          fill="none" stroke={s.color} strokeWidth={thickness}
          strokeDasharray={`${s.dash} ${s.gap}`}
          strokeDashoffset={-s.offset}
          style={{ transition:"stroke-dasharray .5s" }} />
      ))}
    </svg>
  );
}

// ── BarChart ────────────────────────────────────────────────────
function BarChart({ bars, maxVal }) {
  const max = maxVal || Math.max(...bars.map(b=>Math.max(b.a,b.b)), 1);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:8, height:120, padding:"0 4px" }}>
      {bars.map((b,i) => (
        <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
          <div style={{ width:"100%", display:"flex", gap:2, alignItems:"flex-end", height:100 }}>
            <div style={{ flex:1, background:C.positive, borderRadius:"3px 3px 0 0", height:`${(b.a/max)*100}%`, minHeight:b.a>0?2:0, transition:"height .5s" }} />
            <div style={{ flex:1, background:C.negative, borderRadius:"3px 3px 0 0", height:`${(b.b/max)*100}%`, minHeight:b.b>0?2:0, transition:"height .5s" }} />
          </div>
          <div style={{ fontSize:8, color:C.textDim, textAlign:"center", letterSpacing:0.5 }}>{b.label}</div>
        </div>
      ))}
    </div>
  );
}

// ── LineChart ───────────────────────────────────────────────────
function LineChart({ points, color="#4361ee" }) {
  if (points.length < 2) return (
    <div style={{ textAlign:"center", padding:"30px 0", color:C.textDim, fontSize:11 }}>
      Necesitas al menos 2 meses cerrados
    </div>
  );
  const W=300, H=100, pad=10;
  const vals = points.map(p=>p.v);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const px = (i) => pad + (i/(points.length-1))*(W-pad*2);
  const py = (v) => H - pad - ((v-minV)/range)*(H-pad*2);
  const d = points.map((p,i)=>`${i===0?"M":"L"}${px(i)},${py(p.v)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:100, overflow:"visible" }}>
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={d + ` L${px(points.length-1)},${H} L${px(0)},${H} Z`} fill="url(#lg)" />
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {points.map((p,i) => (
        <g key={i}>
          <circle cx={px(i)} cy={py(p.v)} r={3} fill={color} />
          <text x={px(i)} y={py(p.v)-8} textAnchor="middle" fontSize="7" fill={C.textMid}>{p.label}</text>
        </g>
      ))}
    </svg>
  );
}

      checking, savings, totalIncome, totalExp, totalPaid,
      cardDebt, loanDebt, netWorth, note: closeNote,
      income:[...income], expenses:[...expenses], cards:[...cards], loans:[...loans],
    };
    setHistory(p => [snap, ...p]);
    // Apply planner items as new expenses for next month
    const baseExp = expenses.filter(e => e.cat!=="variable").map(e => ({...e, paid:false, abonado:0}));
    const plannerExp = plannerItems.map(p => ({...p, id:Date.now()+Math.random(), paid:false, abonado:0}));
    setExpenses([...baseExp, ...plannerExp]);
    setPlannerItems([]);
    setIncome([]);
    setCloseNote("");
    const parts = currentMonth.split(" ");
    const mIdx = MONTHS.indexOf(parts[0]);
    const yr = parseInt(parts[1]);
    setCurrentMonth(`${MONTHS[mIdx===11?0:mIdx+1]} ${mIdx===11?yr+1:yr}`);
    setConfirmClose(false);
    setTab("gastos");
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ checking, savings, cards, loans, expenses, income, history, currentMonth })], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `finanzas-${currentMonth.replace(" ","-")}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData = () => {
    try {
      const data = JSON.parse(importText);
      if (!data.expenses || !data.cards) throw new Error();
      if (data.checking     !== undefined) setChecking(data.checking);
      if (data.savings      !== undefined) setSavings(data.savings);
      if (data.currentMonth !== undefined) setCurrentMonth(data.currentMonth);
      if (data.cards)    setCards(data.cards);
      if (data.loans)    setLoans(data.loans);
      if (data.expenses) setExpenses(data.expenses);
      if (data.income)   setIncome(data.income);
      if (data.history)  setHistory(data.history);
      setShowImport(false); setImportText(""); setImportError("");
    } catch {
      setImportError("Archivo inválido. Copia el contenido completo del archivo .json.");
    }
  };

  // ── Styles ───────────────────────────────────────────────────
  const S = {
    app:   { fontFamily:FONT, background:C.bg, minHeight:"100vh", color:C.text, maxWidth:480, margin:"0 auto", paddingBottom:90 },
    card:  { background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:14, padding:"14px" },
    inp:   { background:C.bg, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"8px 10px", color:C.text, fontFamily:FONT, fontSize:13, width:"100%", boxSizing:"border-box" },
    lbl:   { fontSize:9, letterSpacing:3.5, color:C.textMid, textTransform:"uppercase", marginBottom:6 },
    row:   { borderBottom:`1px solid ${C.border}` },
    modal: { position:"fixed", inset:0, background:"#000000cc", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:"0 24px" },
    mbox:  { background:"#0d1818", border:`1px solid ${C.borderMid}`, borderRadius:16, padding:"24px 20px", width:"100%", maxWidth:340 },
    tab:   a => ({ flex:1, padding:"11px 0", background:"none", border:"none", cursor:"pointer", fontSize:9, letterSpacing:1.5, textTransform:"uppercase", fontFamily:FONT, color:a?C.primary:C.textDim, borderBottom:a?`2px solid ${C.primary}`:"2px solid transparent" }),
    btn:   (bg, fg) => ({ background:bg||C.primary, border:"none", borderRadius:8, padding:"7px 14px", color:fg||C.bg, fontWeight:"bold", cursor:"pointer", fontSize:12, fontFamily:FONT }),
    sbtn:  { background:C.bgCard, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"7px 10px", color:C.textMid, cursor:"pointer", fontSize:11, fontFamily:FONT, fontWeight:"bold" },
    gbtn:  { background:C.bgCard, border:`1px solid ${C.primary}`, borderRadius:8, padding:"7px 10px", color:C.primary, cursor:"pointer", fontSize:11, fontFamily:FONT, fontWeight:"bold" },
  };

  const CATS = ["fijo","tarjeta","suscripcion","variable"];
  const CAT_LABEL = { fijo:"Gastos Fijos", tarjeta:"Tarjetas", suscripcion:"Suscripciones", variable:"Variables" };

  return (
    <div style={S.app}>

      {/* HEADER */}
      <div style={{ background:`linear-gradient(155deg,${C.bgCard} 0%,#0a1616 100%)`, borderBottom:`1px solid ${C.border}`, padding:"20px 18px 16px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <div style={{ fontSize:9, letterSpacing:3.5, color:C.textMid, textTransform:"uppercase", marginBottom:2 }}>
              <Editable value={currentMonth} onSave={setCurrentMonth} type="text" color={C.textMid} />
            </div>
            <div style={{ fontSize:20, fontWeight:"bold" }}>Hola, JuanMa 👋</div>
          </div>
          <div style={{ display:"flex", gap:14, alignItems:"flex-start" }}>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:9, letterSpacing:2, color:C.textMid, textTransform:"uppercase" }}>Savings</div>
              <div style={{ fontSize:16, fontWeight:"bold", color:C.positive }}>$<Editable value={savings} onSave={setSavings} color={C.positive} /></div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:9, letterSpacing:2, color:C.textMid, textTransform:"uppercase" }}>Checking</div>
              <div style={{ fontSize:20, fontWeight:"bold", color:C.primary }}>$<Editable value={checking} onSave={setChecking} color={C.primary} /></div>
              <div style={{ fontSize:9, color:C.textDim, marginTop:1 }}>{cop(checking)}</div>
            </div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginTop:14 }}>
          {[
            { l:"Pagado",    v:usd(totalPaid),   c:C.positive },
            { l:"Pendiente", v:usd(totalPend),   c:totalPend>checking?C.negative:C.primary },
            { l:"Ingresos",  v:usd(totalIncome), c:"#7c6ed4" },
          ].map((k,i) => (
            <div key={i} style={{ background:C.bgDeep, borderRadius:10, padding:"9px 8px", border:`1px solid ${C.border}` }}>
              <div style={{ fontSize:8, letterSpacing:1.5, color:C.textDim, textTransform:"uppercase", marginBottom:3 }}>{k.l}</div>
              <div style={{ fontSize:13, fontWeight:"bold", color:k.c }}>{k.v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* TABS */}
      <div style={{ display:"flex", background:"#0e0c08", borderBottom:"1px solid #1a1710" }}>
        {[["gastos","Gastos"],["ingresos","Ingresos"],["deudas","Deudas"],["resumen","Resumen"],["graficas","Gráficas"],["historial","Historial"]].map(([k,l]) => (
          <button key={k} style={S.tab(tab===k)} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      <div style={{ padding:"0 16px" }}>

        {/* ══ GASTOS ══ */}
        {tab==="gastos" && (
          <div style={{ marginTop:18 }}>
            <div style={{ ...S.card, marginBottom:18 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                <span style={S.lbl}>Progreso del mes</span>
                <span style={{ fontSize:11, color:C.primary }}>{totalExp>0 ? Math.round((totalPaid/totalExp)*100) : 0}%</span>
              </div>
              <div style={{ height:7, background:C.border, borderRadius:4, overflow:"hidden", marginBottom:10 }}>
                <div style={{ height:"100%", width:`${totalExp>0?(totalPaid/totalExp)*100:0}%`, background:`linear-gradient(90deg,${C.primary},${C.positive})`, borderRadius:4, transition:"width .5s" }} />
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6 }}>
                {[{l:"Total",v:usd(totalExp),c:C.text},{l:"Pagado",v:usd(totalPaid),c:C.positive},{l:"Pendiente",v:usd(totalPend),c:C.negative}].map((s,i) => (
                  <div key={i} style={{ background:C.bgDeep, borderRadius:8, padding:"8px 4px", textAlign:"center" }}>
                    <div style={{ fontSize:8, color:C.textDim, letterSpacing:1.5, textTransform:"uppercase" }}>{s.l}</div>
                    <div style={{ fontSize:12, fontWeight:"bold", color:s.c, marginTop:3 }}>{s.v}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div style={S.lbl}>Todos los gastos</div>
              <button style={S.btn()} onClick={() => setShowAddExp(!showAddExp)}>+ Agregar</button>
            </div>

            {showAddExp && (
              <div style={{ ...S.card, marginBottom:14 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Nombre" value={newExp.name} onChange={e=>setNewExp(p=>({...p,name:e.target.value}))} style={S.inp} />
                  <input placeholder="Monto $" type="number" value={newExp.amount} onChange={e=>setNewExp(p=>({...p,amount:e.target.value}))} style={S.inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <select value={newExp.cat} onChange={e=>setNewExp(p=>({...p,cat:e.target.value}))} style={S.inp}>
                    <option value="fijo">Fijo</option>
                    <option value="suscripcion">Suscripción</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="variable">Variable</option>
                  </select>
                  <input placeholder="Día" type="number" value={newExp.dueDay} onChange={e=>setNewExp(p=>({...p,dueDay:parseInt(e.target.value)||1}))} style={S.inp} />
                </div>
                <input placeholder="Notas" value={newExp.notes} onChange={e=>setNewExp(p=>({...p,notes:e.target.value}))} style={{...S.inp,marginBottom:10}} />
                <button onClick={addExp} style={{...S.btn(),width:"100%",padding:"10px",fontSize:14}}>Guardar</button>
              </div>
            )}

            {CATS.map(cat => {
              const list = expenses.filter(e=>e.cat===cat).sort((a,b)=>a.dueDay-b.dueDay);
              if (!list.length && cat !== "suscripcion") return null;
              const catTotal = list.reduce((a,e)=>a+e.amount,0);

              // Suscripciones tienen su propio botón de agregar
              const isSub = cat === "suscripcion";

              return (
                <div key={cat} style={{ marginBottom:22 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                    <div style={S.lbl}>{CAT_LABEL[cat]}</div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:12, color:C.primary }}>{usd(catTotal)}</span>
                      {isSub && (
                        <button
                          onClick={() => {
                            const name = prompt("Nombre de la suscripción:");
                            if (!name) return;
                            const amtStr = prompt("Monto mensual ($):");
                            const amount = parseFloat(amtStr);
                            if (!amount || isNaN(amount)) return;
                            const dayStr = prompt("Día de cobro (1-31):", "1");
                            const dueDay = Math.max(1, Math.min(31, parseInt(dayStr)||1));
                            setExpenses(p => [...p, { id:Date.now(), name, amount, cat:"suscripcion", dueDay, paid:false, abonado:0, notes:"" }]);
                          }}
                          style={{ ...S.btn(), padding:"4px 10px", fontSize:11 }}>+ Sub</button>
                      )}
                    </div>
                  </div>
                  {list.length === 0 && isSub && (
                    <div style={{ fontSize:11, color:C.textDim, padding:"10px 0", textAlign:"center" }}>Sin suscripciones — toca + Sub para agregar</div>
                  )}
                  {list.map(e => <ExpRow key={e.id} e={e} cards={cards} onToggle={togglePaid} onAbono={openAbono} onDelete={delExp} onAmountSave={updExpAmount} onDaySave={updExpDay} />)}
                </div>
              );
            })}
          </div>
        )}

        {/* ══ INGRESOS ══ */}
        {tab==="ingresos" && (
          <div style={{ marginTop:18 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={S.lbl}>Ingresos del mes</div>
              <button style={S.btn()} onClick={() => setShowAddInc(!showAddInc)}>+ Agregar</button>
            </div>
            {showAddInc && (
              <div style={{ ...S.card, marginBottom:14 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Fuente" value={newInc.name} onChange={e=>setNewInc(p=>({...p,name:e.target.value}))} style={S.inp} />
                  <input placeholder="Monto $" type="number" value={newInc.amount} onChange={e=>setNewInc(p=>({...p,amount:e.target.value}))} style={S.inp} />
                </div>
                <input placeholder="Fecha (ej. 15 abr)" value={newInc.date} onChange={e=>setNewInc(p=>({...p,date:e.target.value}))} style={{...S.inp,marginBottom:8}} />
                <input placeholder="Notas" value={newInc.notes} onChange={e=>setNewInc(p=>({...p,notes:e.target.value}))} style={{...S.inp,marginBottom:10}} />
                <button onClick={addInc} style={{...S.btn(),width:"100%",padding:"10px",fontSize:14}}>Guardar</button>
              </div>
            )}
            {income.length===0 && !showAddInc && (
              <div style={{ textAlign:"center", padding:"50px 0", color:C.textDim }}>
                <div style={{ fontSize:36, marginBottom:12 }}>💸</div>
                <div style={{ fontSize:14 }}>Sin ingresos registrados</div>
                <div style={{ fontSize:11, marginTop:6, color:C.textDim }}>Cuando llegue algo, agrégalo aquí</div>
              </div>
            )}
            {income.map(i => (
              <div key={i.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"13px 0", ...S.row }}>
                <div>
                  <div style={{ fontSize:14, color:C.positive, fontWeight:"bold" }}>{i.name}</div>
                  <div style={{ fontSize:10, color:C.textDim }}>{i.date}{i.notes?` · ${i.notes}`:""}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:15, fontWeight:"bold", color:C.positive }}>+{usd(i.amount)}</div>
                    <div style={{ fontSize:9, color:C.textDim }}>{cop(i.amount)}</div>
                  </div>
                  <button onClick={() => delInc(i.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:18 }}>×</button>
                </div>
              </div>
            ))}
            {income.length>0 && (
              <div style={{ ...S.card, marginTop:16 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                  <span style={{ fontSize:13, color:C.textMid }}>Total ingresos</span>
                  <span style={{ fontSize:18, fontWeight:"bold", color:C.positive }}>{usd(totalIncome)}</span>
                </div>
                <div style={{ display:"flex", justifyContent:"space-between" }}>
                  <span style={{ fontSize:12, color:C.textDim }}>vs. gastos totales</span>
                  <span style={{ fontSize:14, fontWeight:"bold", color:totalIncome-totalExp>=0?C.positive:C.negative }}>
                    {totalIncome>=totalExp?"+":""}{usd(totalIncome-totalExp)}
                  </span>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ══ DEUDAS ══ */}
        {tab==="deudas" && (
          <div style={{ marginTop:18 }}>

            {/* Préstamos header + botón */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
              <div style={S.lbl}>Préstamos personales</div>
              <button style={S.gbtn} onClick={() => { setShowAddLoan(!showAddLoan); setShowAddCard(false); }}>+ Préstamo</button>
            </div>

            {showAddLoan && (
              <div style={{ ...S.card, marginBottom:16, borderColor:C.primary }}>
                <div style={{ fontSize:9, color:C.primary, letterSpacing:3, textTransform:"uppercase", marginBottom:10 }}>Nuevo préstamo</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Nombre (ej. SoFi)" value={newLoan.name} onChange={e=>setNewLoan(p=>({...p,name:e.target.value}))} style={S.inp} />
                  <input placeholder="Balance actual $" type="number" value={newLoan.balance} onChange={e=>setNewLoan(p=>({...p,balance:e.target.value}))} style={S.inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Monto original $" type="number" value={newLoan.original} onChange={e=>setNewLoan(p=>({...p,original:e.target.value}))} style={S.inp} />
                  <input placeholder="Cuota/mes $" type="number" value={newLoan.payment} onChange={e=>setNewLoan(p=>({...p,payment:e.target.value}))} style={S.inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="APR %" type="number" value={newLoan.apr} onChange={e=>setNewLoan(p=>({...p,apr:e.target.value}))} style={S.inp} />
                  <input placeholder="Día de pago" type="number" value={newLoan.dueDay} onChange={e=>setNewLoan(p=>({...p,dueDay:e.target.value}))} style={S.inp} />
                </div>
                <input placeholder="Notas" value={newLoan.notes} onChange={e=>setNewLoan(p=>({...p,notes:e.target.value}))} style={{...S.inp, marginBottom:10}} />
                <button onClick={addLoan} style={{...S.btn(), width:"100%", padding:"10px", fontSize:13}}>Guardar préstamo</button>
              </div>
            )}

            {loans.map(l => {
              const prog = Math.round(((l.original-l.balance)/l.original)*100);
              const monthsLeft = Math.ceil(l.balance/l.payment);
              return (
                <div key={l.id} style={{ ...S.card, marginBottom:14, borderTop:`3px solid ${l.color}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                    <span style={{ fontSize:15, fontWeight:"bold" }}>{l.name}</span>
                    <span style={{ fontSize:13, color:C.primary, fontWeight:"bold" }}>{usd(l.balance)}</span>
                  </div>
                  <div style={{ fontSize:9, color:C.textDim, marginBottom:5 }}>Pagado {prog}% — {usd(l.original-l.balance)} de {usd(l.original)}</div>
                  <div style={{ height:7, background:C.border, borderRadius:4, overflow:"hidden", marginBottom:12 }}>
                    <div style={{ height:"100%", width:`${prog}%`, background:l.color, borderRadius:4, opacity:.85 }} />
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                    {[
                      { label:"Mi cuota/mes", field:"payment", val:l.payment },
                      { label:"APR", field:"apr", val:l.apr, suffix:"%" },
                      { label:"Día de pago", field:"dueDay", val:l.dueDay },
                      { label:"~Meses rest.", readOnly:true, val:monthsLeft },
                    ].map((f,i) => (
                      <div key={i} style={{ background:C.bgDeep, borderRadius:8, padding:"8px 10px" }}>
                        <div style={{ fontSize:8, color:C.textDim, letterSpacing:1.5, textTransform:"uppercase", marginBottom:3 }}>{f.label}</div>
                        <div style={{ fontSize:14, color:C.primary }}>
                          {f.readOnly
                            ? <span style={{ color:C.textMid }}>{f.val} meses</span>
                            : <><Editable value={f.val} onSave={v=>updLoan(l.id,f.field,v)}/>{f.suffix||""}</>}
                        </div>
                      </div>
                    ))}
                  </div>
                  {l.notes && <div style={{ marginTop:10, fontSize:10, color:C.textDim, background:C.bgDeep, borderRadius:8, padding:"7px 10px" }}>{l.notes}</div>}
                </div>
              );
            })}

            {/* Tarjetas header + botón */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10, marginBottom:10 }}>
              <div style={S.lbl}>Tarjetas de crédito</div>
              <button style={S.gbtn} onClick={() => { setShowAddCard(!showAddCard); setShowAddLoan(false); }}>+ Tarjeta</button>
            </div>

            {showAddCard && (
              <div style={{ ...S.card, marginBottom:16, borderColor:C.primary }}>
                <div style={{ fontSize:9, color:C.primary, letterSpacing:3, textTransform:"uppercase", marginBottom:10 }}>Nueva tarjeta</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Nombre (ej. Chase)" value={newCard.name} onChange={e=>setNewCard(p=>({...p,name:e.target.value}))} style={S.inp} />
                  <input placeholder="Límite $" type="number" value={newCard.limit} onChange={e=>setNewCard(p=>({...p,limit:e.target.value}))} style={S.inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Balance actual $" type="number" value={newCard.balance} onChange={e=>setNewCard(p=>({...p,balance:e.target.value}))} style={S.inp} />
                  <input placeholder="Pago mínimo $" type="number" value={newCard.minPay} onChange={e=>setNewCard(p=>({...p,minPay:e.target.value}))} style={S.inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Día de pago" type="number" value={newCard.dueDay} onChange={e=>setNewCard(p=>({...p,dueDay:e.target.value}))} style={S.inp} />
                  <input placeholder="Día de corte" type="number" value={newCard.cutDay} onChange={e=>setNewCard(p=>({...p,cutDay:e.target.value}))} style={S.inp} />
                </div>
                <input placeholder="Notas" value={newCard.notes} onChange={e=>setNewCard(p=>({...p,notes:e.target.value}))} style={{...S.inp, marginBottom:10}} />
                <button onClick={addCard} style={{...S.btn(), width:"100%", padding:"10px", fontSize:13}}>Guardar tarjeta</button>
              </div>
            )}

            <div style={{ marginBottom:12 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.textMid, marginBottom:6 }}>
                <span>{usd(cardDebt)} usado</span>
                <span style={{ color:usageColor(overUsage), fontWeight:"bold" }}>{overUsage}% total</span>
                <span>{usd(totalLimit)} límite</span>
              </div>
              <div style={{ height:7, background:C.border, borderRadius:4, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${overUsage}%`, background:usageColor(overUsage), borderRadius:4 }} />
              </div>
              <div style={{ fontSize:9, color:C.textDim, marginTop:5 }}>
                Meta 30% → {usd(totalLimit*.3)} · falta pagar {usd(Math.max(0,cardDebt-totalLimit*.3))}
              </div>
            </div>
            {cards.map(c => {
              const p = usagePct(c.balance, c.limit);
              const toGoal = Math.max(0, c.balance - c.limit*.3);
              return (
                <div key={c.id} style={{ ...S.card, marginBottom:12, borderTop:`3px solid ${c.color}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                    <span style={{ fontSize:14, fontWeight:"bold" }}>{c.name}</span>
                    <span style={{ fontSize:10, background:usageColor(p)+"22", color:usageColor(p), borderRadius:20, padding:"3px 10px", fontWeight:"bold" }}>{p}%</span>

        <div style={S.modal}>
          <div style={{ ...S.mbox, maxWidth:380 }}>
            <div style={{ fontSize:9, letterSpacing:3, color:C.textMid, textTransform:"uppercase", marginBottom:6 }}>Importar datos</div>
            <div style={{ fontSize:14, fontWeight:"bold", marginBottom:6 }}>Pega el contenido del archivo</div>
            <div style={{ fontSize:11, color:C.textMid, marginBottom:14, lineHeight:1.6 }}>
              Abre el .json exportado, selecciona todo el texto, cópialo y pégalo aquí.
            </div>
            <textarea value={importText} onChange={e => { setImportText(e.target.value); setImportError(""); }}
              placeholder='{"checking":1351.96,...}' rows={5}
              style={{ background:C.bg, border:`1px solid ${importError?C.negative:C.borderMid}`, borderRadius:8, padding:"10px 12px", color:C.text, fontFamily:"monospace", fontSize:11, width:"100%", boxSizing:"border-box", marginBottom:importError?6:14, resize:"none" }} />
            {importError && <div style={{ fontSize:11, color:C.negative, marginBottom:12 }}>{importError}</div>}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <button onClick={() => { setShowImport(false); setImportText(""); setImportError(""); }} style={{ background:C.bgCard, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"10px", color:C.textMid, cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Cancelar</button>
              <button onClick={importData} style={{ background:C.primary, border:"none", borderRadius:8, padding:"10px", color:C.bg, fontWeight:"bold", cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Importar</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
