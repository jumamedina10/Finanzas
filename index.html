    * { box-sizing: border-box; margin: 0; padding: 0; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 2px; }
    select option { background: #1c1c1e; color: #ffffff; }
    .fm-tab { transition: background .15s, color .15s; cursor:pointer; }
    [data-theme="dark"]  .fm-tab:hover { background: #232326; }
    [data-theme="light"] .fm-tab:hover { background: #eef2f7; }
    [data-theme="dark"]  .fm-tab.active { background: #6366f11c; }
    [data-theme="light"] .fm-tab.active { background: #2563eb12; }
    .fm-tabs { display:flex; overflow-x:auto; }
    /* Tablet: iPad en vertical, celulares grandes en horizontal */
    @media (min-width: 700px) {
      .fm-shell { max-width: 700px !important; }
      .fm-tabs { overflow-x: visible; }
    }
    /* Desktop / laptop, iPad en horizontal: aprovecha el ancho con columnas */
    @media (min-width: 1050px) {
      .fm-shell { max-width: 1080px !important; }
      .fm-loans-grid, .fm-cards-grid { display:grid !important; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
      .fm-graf-grid { display:grid !important; grid-template-columns:1fr 1fr; gap:16px; }
      .fm-graf-grid > div { margin-bottom:0 !important; }
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const COP_RATE = 4050;

    const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

    const usd = n => "$" + Number(n||0).toLocaleString("en", { minimumFractionDigits:2, maximumFractionDigits:2 });
    const cop = (n, rate) => "$" + Math.round((n||0) * (rate||COP_RATE)).toLocaleString("es-CO") + " COP";
    const formatCOP = n => "$" + Math.round(n||0).toLocaleString("es-CO") + " COP";
    const usagePct = (b, l) => l > 0 ? Math.min(100, Math.round((b/l)*100)) : 0;

    // La libreria de Excel (xlsx) es pesada (~700kb) y solo se necesita si el usuario exporta.
    // Se carga bajo demanda para no sumarle peso a la carga inicial de la app.
    let _xlsxPromise = null;
    const loadXLSX = () => {
      if (window.XLSX) return Promise.resolve();
      if (_xlsxPromise) return _xlsxPromise;
      _xlsxPromise = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
        s.onload = resolve;
        s.onerror = () => { _xlsxPromise = null; reject(new Error("No se pudo cargar la libreria de Excel")); };
        document.head.appendChild(s);
      });
      return _xlsxPromise;
    };
    const todayLabel = () => new Date().toLocaleDateString("es", { day:"numeric", month:"short" });

    const load = () => { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } };
    const persist = d => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} };

      { id:1789084597681, text:"Quiero que haya un apartado en el que pueda enlistar mis responsabilidades de Colombia, y así mismo se actualice el rubro de Gastos llamado Colombia", date:"10 sept 2026", done:true },

    ];

    const INIT_HISTORY = []; // El historial anterior queda en tu JSON viejo; el modelo de datos cambió.

    // ================= Helpers =================
    const paidAmt = item => (item.payments||[]).reduce((a,p)=>a+(p.amount||0),0);
    const isFullyPaid = (item, amt) => amt>0 && paidAmt(item) >= amt-0.005;

    function Editable({ value, onSave, color, type="number", C, width }) {
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(value);
      const clr = color || C.primary;
      if (editing) return (
        <input autoFocus type={type} value={val}
          onChange={e => setVal(e.target.value)}
          onBlur={() => { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); }}
          onKeyDown={e => { if (e.key==="Enter") { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); } }}
          style={{ width:width||(type==="text"?160:90), background:C.bgDeep, border:`1.5px solid ${C.primary}`, borderRadius:6, padding:"3px 8px", color:C.text, fontFamily:C.font, fontSize:14 }} />
      );
      return (
        <span onClick={() => { setVal(value); setEditing(true); }} style={{ cursor:"pointer", borderBottom:`1px dashed ${C.borderMid}`, color:clr, fontFamily:C.font }}>
          {typeof value==="number" ? value.toFixed(2) : (value || "(sin nombre)")}
        </span>
      );
    }

    function TitularSelect({ titular, onChange, C }) {
      const t = TITULARES[titular] || TITULARES.conjunta;
      return (
        <select value={titular} onChange={e=>onChange(e.target.value)} style={{
          appearance:"none", WebkitAppearance:"none", border:`1px solid ${t.color}55`, borderRadius:20,
          background:t.color+"22", color:t.color, fontSize:11, fontWeight:"700", fontFamily:C.font,
          padding:"3px 8px", cursor:"pointer", flexShrink:0,
        }} title="A nombre de quien (solo referencia)">
          {Object.keys(TITULARES).map(k=><option key={k} value={k} style={{ background:C.bgCard, color:C.text }}>{TITULARES[k].short} {TITULARES[k].label}</option>)}
        </select>
      );
    }

    function App() {
      const saved = load();
      const [darkMode, setDarkMode] = useState(saved?.darkMode ?? true);
      const C = darkMode ? DARK : LIGHT;

      const [tab, setTab] = useState("resumen");

      const [accounts, setAccounts] = useState(saved?.accounts ?? INIT_ACCOUNTS);
      const [cards, setCards] = useState(saved?.cards ?? INIT_CARDS);
      const [loans, setLoans] = useState(saved?.loans ?? INIT_LOANS);
      const [expenses, setExpenses] = useState(saved?.expenses ?? INIT_EXPENSES);
      const [income, setIncome] = useState(saved?.income ?? INIT_INCOME);
      const [remittances, setRemittances] = useState(saved?.remittances ?? INIT_REMITTANCES);
      const [copRate, setCopRate] = useState(saved?.copRate ?? COP_RATE); // COP por 1 USD, editable porque cambia
      const [salidas, setSalidas] = useState(saved?.salidas ?? INIT_SALIDAS);
      const [salidaBudget, setSalidaBudget] = useState(saved?.salidaBudget ?? 50);
      const [history, setHistory] = useState(saved?.history ?? INIT_HISTORY);
      const [appNotes, setAppNotes] = useState(saved?.appNotes ?? INIT_APPNOTES);
      const [plannerItems, setPlannerItems] = useState(saved?.plannerItems ?? []);
      const [currentMonth, setCurrentMonth] = useState(saved?.currentMonth ?? "Septiembre 2025");

      const [showAddExp, setShowAddExp] = useState(false);
      const [gastosFiltro, setGastosFiltro] = useState("todos"); // "todos" | "juanma" | "mari" — solo filtra la vista de Gastos
      const [showAddInc, setShowAddInc] = useState(false);
      const [showAddCard, setShowAddCard] = useState(false);
      const [showAddLoan, setShowAddLoan] = useState(false);
      const [showAddSalida, setShowAddSalida] = useState(false);
      const [showPlanner, setShowPlanner] = useState(false);
      const [showNotes, setShowNotes] = useState(false);
      const [showImport, setShowImport] = useState(false);
      const [importText, setImportText] = useState("");
      const [importError, setImportError] = useState("");
      const [confirmClose, setConfirmClose] = useState(false);
      const [closeNote, setCloseNote] = useState("");
      const [paymentModal, setPaymentModal] = useState(null); // {kind:'expense'|'card', id}
      const [payAmount, setPayAmount] = useState("");
      const [activeCards, setActiveCards] = useState(null);
      const [newNote, setNewNote] = useState("");

      const [newExp, setNewExp] = useState({ name:"", amount:"", cat:"fijo", dueDay:1, target:"current", titular:"conjunta" });
      const [newInc, setNewInc] = useState({ name:"", amount:"", date:"", titular:"juanma" });
      const [newCard, setNewCard] = useState({ name:"", limit:"", balance:"", minPay:"", dueDay:1, cutDay:0, titular:"juanma" });
      const [newLoan, setNewLoan] = useState({ name:"", original:"", balance:"", payment:"", apr:"", dueDay:1, titular:"juanma", notes:"" });
      const [newSalida, setNewSalida] = useState({ lugar:"", amount:"", method:"debit", notes:"" });
      const [newPlanItem, setNewPlanItem] = useState({ name:"", amount:"", cat:"fijo", dueDay:1 });
      const [newRemit, setNewRemit] = useState({ colombia:{name:"",amount:""}, venezuela:{name:"",amount:""} });

      useEffect(() => {
        document.body.style.background = C.bg;
        persist({ darkMode, accounts, cards, loans, expenses, income, remittances, copRate, salidas, salidaBudget, history, appNotes, plannerItems, currentMonth });
      }, [darkMode, accounts, cards, loans, expenses, income, remittances, copRate, salidas, salidaBudget, history, appNotes, plannerItems, currentMonth]);

      // ---------- resueltos / totales (los totales siempre suman todo, sin importar titular) ----------
      // Colombia se guarda en COP (amountCOP) y se convierte a USD con la tasa vigente (copRate) al sumar.
      const sumRemit = key => (remittances[key]||[]).reduce((a,r)=>{
        if (r.amountCOP!==undefined) return a + (parseFloat(r.amountCOP)||0) / copRate;
        return a + (parseFloat(r.amount)||0);
      }, 0);
      const expensesResolved = expenses.map(e => e.isRemittance ? { ...e, amount: sumRemit(e.isRemittance) } : e);

      const sumAccounts = type => accounts.filter(a=>!type||a.type===type).reduce((a,x)=>a+x.balance,0);
      const checkingTotal = sumAccounts("checking");
      const savingsTotal  = sumAccounts("savings");
      const assetsTotal   = sumAccounts(null);

      const cardDebtTotal = cards.reduce((a,c)=>a+c.balance,0);
      const loanDebtTotal = loans.reduce((a,l)=>a+l.balance,0);
      const totalDebt = cardDebtTotal + loanDebtTotal;
      const netWorth = assetsTotal - totalDebt;

      const cardExpTotal = cards.reduce((a,c)=>a+c.minPay,0);
      const cardExpPaid  = cards.reduce((a,c)=>a+paidAmt(c),0);
      const nonCardExp = expensesResolved.filter(e=>e.cat!=="tarjeta" && e.cat!=="variable");
      const varExp = expensesResolved.filter(e=>e.cat==="variable");
      const fixedTotal = nonCardExp.reduce((a,e)=>a+e.amount,0);
      const varTotal = varExp.reduce((a,e)=>a+e.amount,0);
      const fixedPaid = nonCardExp.reduce((a,e)=>a+paidAmt(e),0);
      const varPaid = varExp.reduce((a,e)=>a+paidAmt(e),0);
      const fijoTotal = expensesResolved.filter(e=>e.cat==="fijo").reduce((a,e)=>a+e.amount,0);
      const subsTotal = expensesResolved.filter(e=>e.cat==="suscripcion").reduce((a,e)=>a+e.amount,0);

      const totalExp = fixedTotal + varTotal + cardExpTotal + salidaBudget;
      const totalPaid = fixedPaid + varPaid + cardExpPaid;
      const totalPend = totalExp - totalPaid;
      const totalIncome = income.reduce((a,i)=>a+i.amount,0);
      const salidaTotal = salidas.reduce((a,s)=>a+s.amount,0);
      const runway = totalExp>0 ? checkingTotal/totalExp : 99;

      // ---------- CRUD ----------
      const setTitular = (setFn, id, value) => setFn(prev => prev.map(it => it.id===id ? {...it, titular:value} : it));
      const updField = (setFn, id, field, value) => setFn(prev => prev.map(it => it.id===id ? {...it, [field]:value} : it));
      const delFrom = (setFn, id) => setFn(prev => prev.filter(it => it.id!==id));

      const addExp = () => {
        if (!newExp.name || !newExp.amount) return;
        const item = { id:Date.now(), name:newExp.name, amount:parseFloat(newExp.amount), cat:newExp.cat, dueDay:parseInt(newExp.dueDay)||1, notes:"", payments:[], titular:newExp.titular };
        if (newExp.target==="next") setPlannerItems(p=>[...p, { name:item.name, amount:item.amount, cat:item.cat, dueDay:item.dueDay, titular:item.titular }]);
        else setExpenses(p=>[...p, item]);
        setNewExp({ name:"", amount:"", cat:"fijo", dueDay:1, target:"current", titular:"conjunta" });
        setShowAddExp(false);
      };
      const addInc = () => {
        if (!newInc.name || !newInc.amount) return;
        setIncome(p=>[...p, { id:Date.now(), titular:newInc.titular, name:newInc.name, amount:parseFloat(newInc.amount), date:newInc.date, notes:"" }]);
        setNewInc({ name:"", amount:"", date:"", titular:"juanma" });
        setShowAddInc(false);
      };
      const CARD_COLORS = ["#ef4444","#6366f1","#8b5cf6","#f59e0b","#22c55e","#06b6d4"];
      const addCard = () => {
        if (!newCard.name || !newCard.limit) return;
        setCards(p=>[...p, { id:"card_"+Date.now(), titular:newCard.titular, name:newCard.name, color:CARD_COLORS[cards.length%CARD_COLORS.length],
          limit:parseFloat(newCard.limit), balance:parseFloat(newCard.balance)||0, statBal:parseFloat(newCard.balance)||0,
          minPay:parseFloat(newCard.minPay)||0, dueDay:parseInt(newCard.dueDay)||1, cutDay:parseInt(newCard.cutDay)||0, notes:"", payments:[] }]);
        setNewCard({ name:"", limit:"", balance:"", minPay:"", dueDay:1, cutDay:0, titular:"juanma" });
        setShowAddCard(false);
      };
      const LOAN_COLORS = ["#06b6d4","#8b5cf6","#f59e0b","#ef4444","#22c55e","#6366f1"];
      const addLoan = () => {
        if (!newLoan.name || !newLoan.balance || !newLoan.payment) return;
        const orig = parseFloat(newLoan.original)||parseFloat(newLoan.balance);
        setLoans(p=>[...p, { id:"loan_"+Date.now(), titular:newLoan.titular, name:newLoan.name, color:LOAN_COLORS[loans.length%LOAN_COLORS.length],
          original:orig, balance:parseFloat(newLoan.balance), payment:parseFloat(newLoan.payment), apr:parseFloat(newLoan.apr)||0,
          dueDay:parseInt(newLoan.dueDay)||1, notes:newLoan.notes }]);
        setNewLoan({ name:"", original:"", balance:"", payment:"", apr:"", dueDay:1, titular:"juanma", notes:"" });
        setShowAddLoan(false);
      };
      const addSalida = () => {
        if (!newSalida.lugar || !newSalida.amount) return;
        setSalidas(p=>[{ id:Date.now(), lugar:newSalida.lugar, amount:parseFloat(newSalida.amount), method:newSalida.method, notes:newSalida.notes, date:todayLabel() }, ...p]);
        setNewSalida({ lugar:"", amount:"", method:"debit", notes:"" });
        setShowAddSalida(false);
      };
      const addPlanItem = () => {
        if (!newPlanItem.name || !newPlanItem.amount) return;
        setPlannerItems(p=>[...p, { ...newPlanItem, amount:parseFloat(newPlanItem.amount) }]);
        setNewPlanItem({ name:"", amount:"", cat:"fijo", dueDay:1 });
      };
      const delPlanItem = idx => setPlannerItems(p=>p.filter((_,i)=>i!==idx));
      const addAppNote = () => {
        if (!newNote.trim()) return;
        setAppNotes(p=>[{ id:Date.now(), text:newNote.trim(), date:new Date().toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"}), done:false }, ...p]);
        setNewNote("");
      };
      const delAppNote = id => setAppNotes(p=>p.filter(n=>n.id!==id));
      const toggleNoteDone = id => setAppNotes(p=>p.map(n=>n.id===id?{...n,done:!n.done}:n));

      const addRemit = key => {
        const r = newRemit[key];
        if (!r.name || !r.amount) return;
        const entry = key==="colombia"
          ? { id:Date.now(), name:r.name, amountCOP:parseFloat(r.amount), notes:"" }
          : { id:Date.now(), name:r.name, amount:parseFloat(r.amount), notes:"" };
        setRemittances(p=>({ ...p, [key]:[...p[key], entry] }));
        setNewRemit(p=>({ ...p, [key]:{name:"",amount:""} }));
      };
      const delRemit = (key, id) => setRemittances(p=>({ ...p, [key]:p[key].filter(r=>r.id!==id) }));

      // ---------- pagos parciales ----------
      const paymentTargetList = kind => kind==="expense" ? expensesResolved : cards;
      const paymentSetFn = kind => kind==="expense" ? setExpenses : setCards;
      const openPayment = (kind, id) => { setPayAmount(""); setPaymentModal({ kind, id }); };
      const addPaymentEntry = amt => {
        if (!paymentModal || !amt) return;
        const { kind, id } = paymentModal;
        paymentSetFn(kind)(prev => prev.map(it => it.id===id ? { ...it, payments:[...(it.payments||[]), { id:Date.now(), amount:parseFloat(amt)||0, date:todayLabel() }] } : it));
        setPayAmount("");
      };
      const deletePaymentEntry = payId => {
        if (!paymentModal) return;
        const { kind, id } = paymentModal;
        paymentSetFn(kind)(prev => prev.map(it => it.id===id ? { ...it, payments:(it.payments||[]).filter(p=>p.id!==payId) } : it));
      };
      const currentPaymentItem = paymentModal ? paymentTargetList(paymentModal.kind).find(it=>it.id===paymentModal.id) : null;

      // ---------- cerrar mes / export / import ----------
      const closeMonth = () => {
        const snap = { id:Date.now(), label:currentMonth, checking:checkingTotal, savings:savingsTotal, totalIncome, totalExp, totalPaid, cardDebt:cardDebtTotal, loanDebt:loanDebtTotal, netWorth, note:closeNote, income:[...income], cards:cards.map(c=>({id:c.id,name:c.name,color:c.color,balance:c.balance})) };
        setHistory(p=>[snap, ...p]);
        const baseExp = expenses.filter(e=>e.cat!=="variable").map(e=>({...e, payments:[]}));
        const plannerExp = plannerItems.map(p=>({ ...p, id:Date.now()+Math.random(), payments:[] }));
        setExpenses([...baseExp, ...plannerExp]);
        setCards(p=>p.map(c=>({ ...c, payments:[] })));
        setPlannerItems([]); setIncome([]); setSalidas([]); setCloseNote("");
        const parts = currentMonth.split(" "), mIdx = MONTHS.indexOf(parts[0]), yr = parseInt(parts[1]);
        setCurrentMonth(`${MONTHS[mIdx===11?0:mIdx+1]} ${mIdx===11?yr+1:yr}`);
        setConfirmClose(false); setTab("resumen");
      };

      const exportData = () => {
        const blob = new Blob([JSON.stringify({ darkMode, accounts, cards, loans, expenses, income, remittances, salidas, salidaBudget, history, appNotes, plannerItems, currentMonth })], { type:"application/json" });
        const url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = url; a.download = `nosotros-${currentMonth.replace(" ","-")}.json`; a.click(); URL.revokeObjectURL(url);
      };

      const sheetOrPlaceholder = rows => rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([["Sin datos todavía"]]);
      const titularLabel = t => (TITULARES[t] || TITULARES.conjunta).label;

      const exportExcel = async () => {
        try {
          await loadXLSX();
        } catch {
          alert("No se pudo cargar la herramienta de Excel. Revisa tu conexión e intenta de nuevo.");
          return;
        }
        const wb = XLSX.utils.book_new();

        const gastosRows = expensesResolved.filter(e=>e.cat!=="tarjeta").map(e => ({
          Nombre: e.name, Monto: e.amount, Categoria: e.cat, Dia: e.dueDay,
          "De quien": e.isRemittance ? "Conjunta" : titularLabel(e.titular),
          Pagado: isFullyPaid(e, e.amount) ? "Sí" : (paidAmt(e) > 0 ? `Parcial (${usd(paidAmt(e))})` : "No"),
          Notas: e.notes || "",
        }));
        XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(gastosRows), "Gastos");

        const tarjetasRows = cards.map(c => ({
          Nombre: c.name, Titular: titularLabel(c.titular), Balance: c.balance, Limite: c.limit,
          "Pago minimo": c.minPay, "Dia de pago": c.dueDay, "Dia de corte": c.cutDay, "Uso %": usagePct(c.balance, c.limit),
        }));
        XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(tarjetasRows), "Tarjetas");

        const prestamosRows = loans.map(l => ({
          Nombre: l.name, Titular: titularLabel(l.titular), Balance: l.balance, Original: l.original,
          Cuota: l.payment, "APR %": l.apr, "Dia de pago": l.dueDay, Notas: l.notes || "",
        }));
        XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(prestamosRows), "Prestamos");

        const histRows = history.map(h => ({
          Mes: h.label, Ingresos: h.totalIncome, Gastos: h.totalExp, Pagado: h.totalPaid,
          "Deuda tarjetas": h.cardDebt, "Deuda prestamos": h.loanDebt, "Patrimonio neto": h.netWorth, Nota: h.note || "",
        }));
        XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(histRows), "Historial");

        const histSorted = [...history].map(h => {
          const parts = h.label.split(" ");
          return { ...h, year: parseInt(parts[1]) || 0, monthIdx: MONTHS.indexOf(parts[0]) };
        }).sort((a,b) => a.year-b.year || a.monthIdx-b.monthIdx);

        const buildPeriodRows = keyFn => {
          const map = {};
          const order = [];
          histSorted.forEach(h => {
            const k = keyFn(h);
            if (!map[k]) { map[k] = { Periodo:k, Meses:0, Ingresos:0, Gastos:0, Pagado:0, "Patrimonio (fin de periodo)":0 }; order.push(k); }
            const row = map[k];
            row.Meses += 1; row.Ingresos += h.totalIncome; row.Gastos += h.totalExp; row.Pagado += h.totalPaid;
            row["Patrimonio (fin de periodo)"] = h.netWorth;
          });
          return order.map(k => map[k]);
        };

        XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(buildPeriodRows(h => String(h.year))), "Resumen anual");
        XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(buildPeriodRows(h => `T${Math.floor(h.monthIdx/3)+1} ${h.year}`)), "Resumen trimestral");
        XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(buildPeriodRows(h => `S${h.monthIdx<6?1:2} ${h.year}`)), "Resumen semestral");

        XLSX.writeFile(wb, `nosotros-${currentMonth.replace(" ","-")}.xlsx`);
      };
      const importData = () => {
        try {
          const data = JSON.parse(importText);
          if (!data.expenses || !data.cards) throw new Error();
          if (data.darkMode!==undefined) setDarkMode(data.darkMode);
          if (data.accounts) setAccounts(data.accounts);
          if (data.cards) setCards(data.cards);
          if (data.loans) setLoans(data.loans);
          if (data.expenses) setExpenses(data.expenses);
          if (data.income) setIncome(data.income);
          if (data.remittances) setRemittances(data.remittances);
          if (data.copRate!==undefined) setCopRate(data.copRate);
          if (data.salidas) setSalidas(data.salidas);
          if (data.salidaBudget!==undefined) setSalidaBudget(data.salidaBudget);
          if (data.history) setHistory(data.history);
          if (data.appNotes) setAppNotes(data.appNotes);
          if (data.plannerItems) setPlannerItems(data.plannerItems);
          if (data.currentMonth) setCurrentMonth(data.currentMonth);
          setShowImport(false); setImportText(""); setImportError("");
        } catch { setImportError("Archivo invalido. Copia el contenido completo del .json."); }
      };

      // ---------- estilos ----------
      const inp = { background:C.inputBg, border:`1.5px solid ${C.borderMid}`, borderRadius:10, padding:"10px 12px", color:C.text, fontFamily:C.font, fontSize:15, width:"100%", boxSizing:"border-box", outline:"none" };
      const lbl = { fontSize:11, letterSpacing:2, color:C.textMid, textTransform:"uppercase", marginBottom:8, fontWeight:"500" };
      const btn = (bg,fg) => ({ background:bg||C.primary, border:"none", borderRadius:10, padding:"9px 16px", color:fg||"#fff", fontWeight:"600", cursor:"pointer", fontSize:14, fontFamily:C.font });
      const sbtn = { background:"none", border:`1.5px solid ${C.borderMid}`, borderRadius:10, padding:"9px 14px", color:C.textMid, cursor:"pointer", fontSize:13, fontFamily:C.font, fontWeight:"500" };
      const gbtn = { background:"none", border:`1.5px solid ${C.primary}`, borderRadius:10, padding:"9px 14px", color:C.primary, cursor:"pointer", fontSize:13, fontFamily:C.font, fontWeight:"600" };
      const card = { background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:16, padding:"16px" };
      const modal = { position:"fixed", inset:0, background:"#000000bb", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:"0 20px" };
      const mbox = { background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:20, padding:"24px 20px", width:"100%", maxWidth:380 };

      const ExpenseRow = e => {
        const abonado = paidAmt(e);
        const full = isFullyPaid(e, e.amount);
        const partial = abonado>0 && !full;
        return (
          <div key={e.id} style={{ padding:"12px 0", borderBottom:`1px solid ${C.border}`, opacity:full?0.45:1 }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, flex:1, minWidth:0 }}>
                <button onClick={()=>openPayment("expense", e.id)} style={{
                  width:22, height:22, borderRadius:7, flexShrink:0, cursor:"pointer",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  border: full?"none":partial?`2px solid ${C.warning}`:`2px solid ${C.primary}`,
                  background: full?C.primary:partial?C.warning+"22":"transparent",
                }}>{full && <span style={{ color:"#fff", fontSize:11, fontWeight:"700" }}>✓</span>}{partial && <span style={{ color:C.warning, fontSize:11, fontWeight:"700" }}>~</span>}</button>
                <div style={{ minWidth:0 }}>
                  <div style={{ fontSize:15, fontWeight:"500", color:C.text, textDecoration:full?"line-through":"none" }}>
                    {e.isRemittance ? e.name : <Editable value={e.name} onSave={v=>updField(setExpenses,e.id,"name",v)} type="text" color={C.text} C={C} width={150} />}
                  </div>
                  <div style={{ fontSize:12, color:C.textMid, marginTop:2 }}>
                    Dia <Editable value={e.dueDay} onSave={v=>updField(setExpenses,e.id,"dueDay",Math.max(1,Math.min(31,Math.round(v))))} color={C.textMid} C={C} />
                    {e.notes?` · ${e.notes}`:""}
                    {partial ? ` · abonado ${usd(abonado)}` : ""}
                  </div>
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                {!e.isRemittance && <TitularSelect titular={e.titular} onChange={v=>setTitular(setExpenses,e.id,v)} C={C} />}
                <div style={{ fontSize:16, fontWeight:"600", color:partial?C.warning:C.primary }}>
                  {e.isRemittance ? usd(e.amount) : <>$<Editable value={e.amount} onSave={v=>updField(setExpenses,e.id,"amount",v)} C={C} /></>}
                </div>
                {!e.isRemittance && <button onClick={()=>delFrom(setExpenses,e.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:20 }}>×</button>}
              </div>
            </div>
          </div>
        );
      };

      const RemitPanel = (key, label, color) => {
        const list = remittances[key]||[];
        const total = sumRemit(key);
        const isCOP = key==="colombia";
        return (
          <div key={key} style={{ ...card, marginBottom:16, borderTop:`3px solid ${color}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:isCOP?4:10 }}>
              <span style={{ ...lbl, marginBottom:0 }}>Responsabilidades · {label}</span>
              <span style={{ fontSize:14, fontWeight:"700", color:color }}>{usd(total)}</span>
            </div>
            {isCOP && (
              <div style={{ fontSize:11, color:C.textDim, marginBottom:10 }}>
                {formatCOP(total*copRate)} · tasa 1 USD = <Editable value={copRate} onSave={setCopRate} color={C.textDim} C={C} /> COP
              </div>
            )}
            {list.length===0 && <div style={{ fontSize:13, color:C.textDim, padding:"6px 0" }}>Sin responsabilidades registradas aún</div>}
            {list.map(r=>{
              const rCOP = r.amountCOP!==undefined;
              return (
                <div key={r.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 0", borderBottom:`1px solid ${C.border}` }}>
                  <span style={{ fontSize:14, color:C.text }}>{r.name}</span>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <div style={{ textAlign:"right" }}>
                      <div style={{ fontSize:14, fontWeight:"600", color:color }}>{rCOP ? formatCOP(r.amountCOP) : usd(r.amount)}</div>
                      {rCOP && <div style={{ fontSize:11, color:C.textDim }}>≈ {usd(r.amountCOP/copRate)}</div>}
                    </div>
                    <button onClick={()=>delRemit(key,r.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:18 }}>×</button>
                  </div>
                </div>
              );
            })}
            <div style={{ display:"flex", gap:8, marginTop:10 }}>
              <input placeholder="Nombre" value={newRemit[key].name} onChange={e=>setNewRemit(p=>({...p,[key]:{...p[key],name:e.target.value}}))} style={{...inp, flex:2}} />
              <input placeholder={isCOP?"Monto en COP":"$"} type="number" value={newRemit[key].amount} onChange={e=>setNewRemit(p=>({...p,[key]:{...p[key],amount:e.target.value}}))} style={{...inp, flex:1}} />
              <button onClick={()=>addRemit(key)} style={btn()}>+</button>
            </div>
            <div style={{ fontSize:11, color:C.textDim, marginTop:8 }}>Este total alimenta el gasto fijo "{label}" automáticamente.</div>
          </div>
        );
      };

      return (
        <div data-theme={darkMode?"dark":"light"} className="fm-shell" style={{ fontFamily:C.font, background:C.bg, minHeight:"100vh", color:C.text, maxWidth:480, margin:"0 auto", paddingBottom:60 }}>

          {/* HEADER */}
          <div style={{ background:C.bgCard, borderBottom:`1px solid ${C.border}`, padding:"18px 18px 14px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:16 }}>
              <div>
                <div style={{ fontSize:12, letterSpacing:2, color:C.textMid, textTransform:"uppercase", marginBottom:4, fontWeight:"500" }}>
                  <Editable value={currentMonth} onSave={setCurrentMonth} type="text" color={C.textMid} C={C} />
                </div>
                <div style={{ fontSize:22, fontWeight:"700", color:C.text }}>Nosotros</div>
                <div style={{ fontSize:11, color:C.textDim, marginTop:2 }}>JuanMa &amp; Mari</div>
              </div>
              <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                <button onClick={()=>setDarkMode(!darkMode)} style={{ background:C.bgDeep, border:`1px solid ${C.borderMid}`, borderRadius:20, padding:"6px 12px", color:C.textMid, cursor:"pointer", fontSize:13 }}>{darkMode?"☀️":"🌙"}</button>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontSize:11, letterSpacing:1, color:C.textMid, textTransform:"uppercase", marginBottom:2 }}>Checking</div>
                  <div style={{ fontSize:22, fontWeight:"700", color:C.primary }}>{usd(checkingTotal)}</div>
                  <div style={{ fontSize:11, color:C.textDim, marginTop:2 }}>{cop(checkingTotal, copRate)}</div>
                </div>
              </div>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8 }}>
              {[
                { l:"Savings", v:usd(savingsTotal), c:C.positive },
                { l:"Pagado", v:usd(totalPaid), c:C.positive },
                { l:"Pendiente", v:usd(totalPend), c:C.primary },
                { l:"Ingresos", v:usd(totalIncome), c:"#8b5cf6" },
              ].map((k,i) => (
                <div key={i} style={{ background:C.bgDeep, borderRadius:12, padding:"10px 6px", border:`1px solid ${C.border}` }}>
                  <div style={{ fontSize:9, letterSpacing:1, color:C.textDim, textTransform:"uppercase", marginBottom:4 }}>{k.l}</div>
                  <div style={{ fontSize:13, fontWeight:"700", color:k.c }}>{k.v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* TABS */}
          <div className="fm-tabs" style={{ background:C.bgCard, borderBottom:`1px solid ${C.border}` }}>
            {[["resumen","Resumen"],["gastos","Gastos"],["ingresos","Ingresos"],["salidas","Salidas"],["deudas","Deudas"],["graficas","Graficas"],["historial","Historial"]].map(([k,l]) => (
              <button key={k} className={`fm-tab ${tab===k?"active":""}`} onClick={()=>setTab(k)} style={{
                flex:1, minWidth:70, padding:"13px 0", background:"none", border:"none", fontSize:10.5, letterSpacing:1, textTransform:"uppercase",
                fontFamily:C.font, fontWeight:tab===k?"700":"400", color:tab===k?C.primary:C.textMid,
                borderBottom:tab===k?`2px solid ${C.primary}`:"2px solid transparent",
              }}>{l}</button>
            ))}
          </div>

          <div style={{ padding:"0 16px" }}>

            {/* RESUMEN */}
            {tab==="resumen" && (
              <div style={{ marginTop:20 }}>
                {(() => {
                  const prev = history[0]; // history queda mas reciente primero
                  const delta = prev ? netWorth - prev.netWorth : null;
                  let streak = netWorth < 0 ? 1 : 0;
                  if (streak > 0) for (const h of history) { if (h.netWorth < 0) streak++; else break; }
                  const pts = [...history].reverse().map(h => ({ v:h.netWorth, label:h.label.split(" ")[0].slice(0,3) }));
                  pts.push({ v:netWorth, label:"Hoy" });
                  return (
                    <div style={{ ...card, marginBottom:16, textAlign:"center", padding:"22px 16px" }}>
                      <div style={lbl}>Patrimonio neto</div>
                      <div style={{ fontSize:36, fontWeight:"700", color:netWorth>=0?C.positive:C.negative }}>{usd(netWorth)}</div>
                      <div style={{ fontSize:12, color:C.textDim, marginTop:4 }}>{cop(netWorth, copRate)}</div>
                      {delta!==null && (
                        <div style={{ fontSize:13, fontWeight:"600", marginTop:8, color:delta>=0?C.positive:C.negative }}>
                          {delta>=0?"↑ ":"↓ "}{delta>=0?"+":""}{usd(delta)} vs mes pasado
                        </div>
                      )}
                      {streak>=2 && (
                        <div style={{ fontSize:12, color:C.negative, marginTop:6, fontWeight:"600" }}>
                          {streak} meses seguidos en negativo
                        </div>
                      )}
                      {pts.length>=2 && (
                        <div style={{ marginTop:14 }}>
                          <LineChart points={pts} color={netWorth>=0?C.positive:C.negative} C={C} />
                        </div>
                      )}
                    </div>
                  );
                })()}

                <div className="fm-grid2" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
                  <div style={card}>
                    <div style={{ fontSize:11, color:C.positive, letterSpacing:2, textTransform:"uppercase", marginBottom:10, fontWeight:"600" }}>Activos</div>
                    <div style={{ fontSize:20, fontWeight:"700", color:C.positive }}>{usd(assetsTotal)}</div>
                  </div>
                  <div style={card}>
                    <div style={{ fontSize:11, color:C.negative, letterSpacing:2, textTransform:"uppercase", marginBottom:10, fontWeight:"600" }}>Deudas</div>
                    <div style={{ fontSize:20, fontWeight:"700", color:C.negative }}>{usd(totalDebt)}</div>
                  </div>
                </div>

                <div style={{ ...card, marginBottom:16 }}>
                  <div style={{ ...lbl, marginBottom:12 }}>Gastos del mes por categoría</div>
                  {[
                    { l:"Fijos", v:fijoTotal },
                    { l:"Tarjetas", v:cardExpTotal },
                    { l:"Suscripciones", v:subsTotal },
                    { l:"Variables", v:varTotal },
                    { l:"Salidas", v:salidaBudget },
                  ].filter(r=>r.v>0).map((r,i)=>(
                    <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"9px 0", borderBottom:`1px solid ${C.border}` }}>
                      <span style={{ fontSize:14, color:C.textMid }}>{r.l}</span>
                      <span style={{ fontWeight:"600", color:C.primary }}>{usd(r.v)}</span>
                    </div>
                  ))}
                  <div style={{ display:"flex", justifyContent:"space-between", paddingTop:12, fontSize:15, fontWeight:"700" }}>
                    <span>Total</span><span style={{ color:C.primary }}>{usd(totalExp)}</span>
                  </div>

    function DonutChart({ data, size=180, thickness=36 }) {
      const total = data.reduce((a,d)=>a+d.value,0);
      if (total===0) return null;
      const cx=size/2, cy=size/2, r=(size-thickness)/2;
      const circ = 2*Math.PI*r;
      let offset=0;
      const slices = data.map(d => { const dash=(d.value/total)*circ, gap=circ-dash; const s={...d,dash,gap,offset}; offset+=dash; return s; });
      return (
        <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
          {slices.map((s,i) => <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={thickness} strokeDasharray={`${s.dash} ${s.gap}`} strokeDashoffset={-s.offset} />)}
        </svg>
      );
    }

    function BarChart({ bars, C }) {
      const max = Math.max(...bars.map(b=>Math.max(b.a,b.b)), 1);
      return (
        <div style={{ display:"flex", alignItems:"flex-end", gap:6, height:120, padding:"0 4px" }}>
          {bars.map((b,i) => (
            <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
              <div style={{ width:"100%", display:"flex", gap:2, alignItems:"flex-end", height:96 }}>
                <div style={{ flex:1, background:C.positive, borderRadius:"3px 3px 0 0", height:`${(b.a/max)*100}%`, minHeight:b.a>0?2:0 }} />
                <div style={{ flex:1, background:C.negative, borderRadius:"3px 3px 0 0", height:`${(b.b/max)*100}%`, minHeight:b.b>0?2:0 }} />
              </div>
              <div style={{ fontSize:10, color:C.textMid, textAlign:"center" }}>{b.label}</div>
            </div>
          ))}
        </div>
      );
    }

    function LineChart({ points, color, C }) {
      if (points.length < 2) return <div style={{ textAlign:"center", padding:"24px 0", color:C.textDim, fontSize:13 }}>Necesitas al menos 2 meses cerrados</div>;
      const W=300, H=100, pad=12;
      const vals=points.map(p=>p.v), minV=Math.min(...vals), maxV=Math.max(...vals), range=maxV-minV||1;
      const px=i=>pad+(i/(points.length-1))*(W-pad*2);
      const py=v=>H-pad-((v-minV)/range)*(H-pad*2);
      const d=points.map((p,i)=>`${i===0?"M":"L"}${px(i)},${py(p.v)}`).join(" ");
      const clr = color || C.primary;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:100, overflow:"visible" }}>
          <defs><linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={clr} stopOpacity="0.25"/><stop offset="100%" stopColor={clr} stopOpacity="0"/></linearGradient></defs>
          <path d={d+` L${px(points.length-1)},${H} L${px(0)},${H} Z`} fill="url(#lg2)" />
          <path d={d} fill="none" stroke={clr} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          {points.map((p,i) => (<g key={i}><circle cx={px(i)} cy={py(p.v)} r={3} fill={clr} /><text x={px(i)} y={py(p.v)-8} textAnchor="middle" fontSize="8" fill={C.textMid}>{p.label}</text></g>))}
        </svg>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
