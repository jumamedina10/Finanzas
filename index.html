function Editable({ value, onSave, color, type="number", C }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const clr = color || C.primary;
  if (editing) return (
    <input autoFocus type={type} value={val}
      onChange={e => setVal(e.target.value)}
      onBlur={() => { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); }}
      onKeyDown={e => { if (e.key==="Enter") { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); } }}
      style={{ width:type==="text"?130:90, background:C.bgDeep, border:`1.5px solid ${C.primary}`, borderRadius:6, padding:"3px 8px", color:C.text, fontFamily:C.font, fontSize:14 }} />
  );
  return (
    <span onClick={() => { setVal(value); setEditing(true); }} style={{ cursor:"pointer", borderBottom:`1px dashed ${C.borderMid}`, color:clr, fontFamily:C.font }}>
      {typeof value==="number" ? value.toFixed(2) : value}
    </span>
  );
}

function DonutChart({ data, size=180, thickness=36 }) {
  const total = data.reduce((a,d)=>a+d.value,0);
  if (total===0) return null;
  const cx=size/2, cy=size/2, r=(size-thickness)/2;
  const circ = 2*Math.PI*r;
  let offset=0;
  const slices = data.map(d => {
    const dash=(d.value/total)*circ, gap=circ-dash;
    const s={...d,dash,gap,offset}; offset+=dash; return s;
  });
  return (
    <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
      {slices.map((s,i) => (
        <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={thickness}
          strokeDasharray={`${s.dash} ${s.gap}`} strokeDashoffset={-s.offset} />
      ))}
    </svg>
  );
}

function BarChart({ bars, C }) {
  const max = Math.max(...bars.map(b=>Math.max(b.a,b.b)), 1);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:6, height:120, padding:"0 4px" }}>
      {bars.map((b,i) => (
        <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
          <div style={{ width:"100%", display:"flex", gap:2, alignItems:"flex-end", height:96 }}>
            <div style={{ flex:1, background:C.positive, borderRadius:"3px 3px 0 0", height:`${(b.a/max)*100}%`, minHeight:b.a>0?2:0 }} />
            <div style={{ flex:1, background:C.negative, borderRadius:"3px 3px 0 0", height:`${(b.b/max)*100}%`, minHeight:b.b>0?2:0 }} />
          </div>
          <div style={{ fontSize:10, color:C.textMid, textAlign:"center" }}>{b.label}</div>
        </div>
      ))}
    </div>
  );
}

function LineChart({ points, color, C }) {
  if (points.length < 2) return (
    <div style={{ textAlign:"center", padding:"24px 0", color:C.textDim, fontSize:13 }}>Necesitas al menos 2 meses cerrados</div>
  );
  const W=300, H=100, pad=12;
  const vals=points.map(p=>p.v), minV=Math.min(...vals), maxV=Math.max(...vals), range=maxV-minV||1;
  const px=i=>pad+(i/(points.length-1))*(W-pad*2);
  const py=v=>H-pad-((v-minV)/range)*(H-pad*2);
  const d=points.map((p,i)=>`${i===0?"M":"L"}${px(i)},${py(p.v)}`).join(" ");
  const clr = color || C.primary;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:100, overflow:"visible" }}>
      <defs>
        <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={clr} stopOpacity="0.25"/>
          <stop offset="100%" stopColor={clr} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={d+` L${px(points.length-1)},${H} L${px(0)},${H} Z`} fill="url(#lg2)" />
      <path d={d} fill="none" stroke={clr} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {points.map((p,i) => (
        <g key={i}>
          <circle cx={px(i)} cy={py(p.v)} r={3} fill={clr} />
          <text x={px(i)} y={py(p.v)-8} textAnchor="middle" fontSize="8" fill={C.textMid}>{p.label}</text>
        </g>
      ))}
    </svg>
  );
}

    setLoans(p=>[...p,{id:"loan_"+Date.now(),name:newLoan.name,color:LOAN_COLORS[loans.length%LOAN_COLORS.length],original:orig,balance:parseFloat(newLoan.balance),payment:parseFloat(newLoan.payment),apr:parseFloat(newLoan.apr)||0,dueDay:parseInt(newLoan.dueDay)||1,notes:newLoan.notes}]);
    setNewLoan({name:"",original:"",balance:"",payment:"",apr:"",dueDay:1,notes:""});
    setShowAddLoan(false);
  };

  const addCard = () => {
    if (!newCard.name||!newCard.limit) return;
    setCards(p=>[...p,{id:"card_"+Date.now(),name:newCard.name,color:CARD_COLORS[cards.length%CARD_COLORS.length],limit:parseFloat(newCard.limit),balance:parseFloat(newCard.balance)||0,statBal:parseFloat(newCard.balance)||0,minPay:parseFloat(newCard.minPay)||0,dueDay:parseInt(newCard.dueDay)||1,cutDay:parseInt(newCard.cutDay)||0,notes:newCard.notes,paid:false,abonado:0}]);
    setNewCard({name:"",limit:"",balance:"",minPay:"",dueDay:1,cutDay:0,notes:""});
    setShowAddCard(false);
  };

  const addSalida = () => {
    if (!newSalida.lugar||!newSalida.amount) return;
    setSalidas(p=>[{id:Date.now(),lugar:newSalida.lugar,amount:parseFloat(newSalida.amount),method:newSalida.method,notes:newSalida.notes,date:new Date().toLocaleDateString("es",{day:"numeric",month:"short"})},...p]);
    setNewSalida({lugar:"",amount:"",method:"debit",notes:""});
    setShowAddSalida(false);
  };

  const addAppNote = () => {
    if (!newNote.trim()) return;
    setAppNotes(p=>[{id:Date.now(),text:newNote.trim(),date:new Date().toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"})},...p]);
    setNewNote("");
  };
  const delAppNote = id => setAppNotes(p=>p.filter(n=>n.id!==id));

  const closeMonth = () => {
    const snap={id:Date.now(),label:currentMonth,checking,savings,totalIncome,totalExp,totalPaid,cardDebt,loanDebt,netWorth,note:closeNote,income:[...income],expenses:[...expenses],cards:[...cards],loans:[...loans],salidaTotal};
    setHistory(p=>[snap,...p]);
    const baseExp = expenses.filter(e=>e.cat!=="variable").map(e=>({...e,paid:false,abonado:0}));
    const plannerExp = plannerItems.map(p=>({...p,id:Date.now()+Math.random(),paid:false,abonado:0}));
    setExpenses([...baseExp,...plannerExp]);
    setCards(p=>p.map(c=>({...c,paid:false,abonado:0})));
    setPlannerItems([]); setIncome([]); setQuickSpends([]); setSalidas([]); setCloseNote("");
    const parts=currentMonth.split(" "), mIdx=MONTHS.indexOf(parts[0]), yr=parseInt(parts[1]);
    setCurrentMonth(`${MONTHS[mIdx===11?0:mIdx+1]} ${mIdx===11?yr+1:yr}`);
    setConfirmClose(false); setTab("gastos");
  };

  const exportData = () => {
    const blob=new Blob([JSON.stringify({darkMode,checking,savings,cards,loans,expenses,income,history,currentMonth,quickSpends,appNotes,salidas,salidaBudget})],{type:"application/json"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=`finanzas-${currentMonth.replace(" ","-")}.json`; a.click(); URL.revokeObjectURL(url);
  };

  const importData = () => {
    try {
      const data=JSON.parse(importText);
      if (!data.expenses||!data.cards) throw new Error();
      if (data.darkMode!==undefined) setDarkMode(data.darkMode);
      if (data.checking!==undefined) setChecking(data.checking);
      if (data.savings!==undefined) setSavings(data.savings);
      if (data.currentMonth!==undefined) setCurrentMonth(data.currentMonth);
      if (data.cards) setCards(data.cards);
      if (data.loans) setLoans(data.loans);
      if (data.expenses) setExpenses(data.expenses);
      if (data.income) setIncome(data.income);
      if (data.history) setHistory(data.history);
      if (data.quickSpends) setQuickSpends(data.quickSpends);
      if (data.appNotes) setAppNotes(data.appNotes);
      if (data.salidas) setSalidas(data.salidas);
      if (data.salidaBudget!==undefined) setSalidaBudget(data.salidaBudget);
      setShowImport(false); setImportText(""); setImportError("");
    } catch { setImportError("Archivo invalido. Copia el contenido completo del .json."); }
  };

  const inp = { background:C.inputBg, border:`1.5px solid ${C.borderMid}`, borderRadius:10, padding:"10px 12px", color:C.text, fontFamily:C.font, fontSize:15, width:"100%", boxSizing:"border-box", outline:"none" };
  const lbl = { fontSize:11, letterSpacing:2, color:C.textMid, textTransform:"uppercase", marginBottom:8, fontWeight:"500" };
  const btn = (bg,fg) => ({ background:bg||C.primary, border:"none", borderRadius:10, padding:"9px 16px", color:fg||"#fff", fontWeight:"600", cursor:"pointer", fontSize:14, fontFamily:C.font });
  const sbtn = { background:"none", border:`1.5px solid ${C.borderMid}`, borderRadius:10, padding:"9px 14px", color:C.textMid, cursor:"pointer", fontSize:13, fontFamily:C.font, fontWeight:"500" };
  const gbtn = { background:"none", border:`1.5px solid ${C.primary}`, borderRadius:10, padding:"9px 14px", color:C.primary, cursor:"pointer", fontSize:13, fontFamily:C.font, fontWeight:"600" };
  const rbtn = { background:"none", border:"none", color:C.negative, cursor:"pointer", fontSize:14, padding:"4px 8px", fontFamily:C.font };
  const card = { background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:16, padding:"16px" };
  const modal = { position:"fixed", inset:0, background:"#000000bb", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:"0 20px" };
  const mbox = { background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:20, padding:"24px 20px", width:"100%", maxWidth:360 };
  const tabStyle = a => ({ flex:1, padding:"13px 0", background:"none", border:"none", cursor:"pointer", fontSize:10, letterSpacing:1, textTransform:"uppercase", fontFamily:C.font, fontWeight:a?"600":"400", color:a?C.primary:C.textMid, borderBottom:a?`2px solid ${C.primary}`:`2px solid transparent` });

  const CATS_SHOW = ["fijo","suscripcion","variable"];
  const CAT_LABEL = { fijo:"Fijos", tarjeta:"Tarjetas", suscripcion:"Suscripciones", variable:"Variables" };

  return (
    <div style={{ fontFamily:C.font, background:C.bg, minHeight:"100vh", color:C.text, maxWidth:480, margin:"0 auto", paddingBottom:90 }}>

      {/* HEADER */}
      <div style={{ background:C.bgCard, borderBottom:`1px solid ${C.border}`, padding:"20px 18px 16px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
          <div>
            <div style={{ fontSize:12, letterSpacing:2, color:C.textMid, textTransform:"uppercase", marginBottom:4, fontWeight:"500" }}>
              <Editable value={currentMonth} onSave={setCurrentMonth} type="text" color={C.textMid} C={C} />
            </div>
            <div style={{ fontSize:22, fontWeight:"700", color:C.text }}>Hola, JuanMa</div>
          </div>
          <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
            <button onClick={()=>setDarkMode(!darkMode)} style={{ background:C.bgDeep, border:`1px solid ${C.borderMid}`, borderRadius:20, padding:"6px 12px", color:C.textMid, cursor:"pointer", fontSize:13, fontFamily:C.font }}>
              {darkMode ? "☀️" : "🌙"}
            </button>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:11, letterSpacing:1, color:C.textMid, textTransform:"uppercase", marginBottom:2 }}>Checking</div>
              <div style={{ fontSize:24, fontWeight:"700", color:C.primary }}>$<Editable value={checking} onSave={setChecking} C={C} /></div>
              <div style={{ fontSize:11, color:C.textDim, marginTop:2 }}>{cop(checking)}</div>
            </div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8 }}>
          {[
            {l:"Savings", v:usd(savings), c:C.positive, action:()=>{}},
            {l:"Pagado",  v:usd(totalPaid), c:C.positive},
            {l:"Pendiente",v:usd(totalPend), c:totalPend>checking?C.negative:C.primary},
            {l:"Ingresos", v:usd(totalIncome), c:"#8b5cf6"},
          ].map((k,i) => (
            <div key={i} style={{ background:C.bgDeep, borderRadius:12, padding:"10px 8px", border:`1px solid ${C.border}` }}>
              <div style={{ fontSize:10, letterSpacing:1.5, color:C.textDim, textTransform:"uppercase", marginBottom:4 }}>{k.l}</div>
              <div style={{ fontSize:14, fontWeight:"700", color:k.c }}>{k.v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* TABS */}
      <div style={{ display:"flex", background:C.bgCard, borderBottom:`1px solid ${C.border}`, overflowX:"auto" }}>
        {[["gastos","Gastos"],["ingresos","Ingresos"],["salidas","Salidas"],["deudas","Deudas"],["resumen","Resumen"],["graficas","Graficas"],["historial","Historial"]].map(([k,l]) => (
          <button key={k} style={tabStyle(tab===k)} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>

      <div style={{ padding:"0 16px" }}>

        {/* GASTOS */}
        {tab==="gastos" && (
          <div style={{ marginTop:20 }}>
            <div style={{ ...card, marginBottom:20 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
                <span style={lbl}>Progreso del mes</span>
                <span style={{ fontSize:13, color:C.primary, fontWeight:"600" }}>{totalExp>0?Math.round((totalPaid/totalExp)*100):0}%</span>
              </div>
              <div style={{ height:8, background:C.bgDeep, borderRadius:4, overflow:"hidden", marginBottom:12 }}>
                <div style={{ height:"100%", width:`${totalExp>0?(totalPaid/totalExp)*100:0}%`, background:C.primary, borderRadius:4, transition:"width .5s" }} />
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
                {[{l:"Total",v:usd(totalExp),c:C.text},{l:"Pagado",v:usd(totalPaid),c:C.positive},{l:"Pendiente",v:usd(totalPend),c:C.negative}].map((s,i) => (
                  <div key={i} style={{ background:C.bgDeep, borderRadius:10, padding:"10px 6px", textAlign:"center" }}>
                    <div style={{ fontSize:10, color:C.textDim, letterSpacing:1.5, textTransform:"uppercase", marginBottom:4 }}>{s.l}</div>
                    <div style={{ fontSize:14, fontWeight:"700", color:s.c }}>{s.v}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <span style={lbl}>Todos los gastos</span>
              <button style={btn()} onClick={()=>setShowAddExp(!showAddExp)}>+ Agregar</button>
            </div>

            {showAddExp && (
              <div style={{ ...card, marginBottom:16 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
                  <input placeholder="Nombre" value={newExp.name} onChange={e=>setNewExp(p=>({...p,name:e.target.value}))} style={inp} />
                  <input placeholder="Monto $" type="number" value={newExp.amount} onChange={e=>setNewExp(p=>({...p,amount:e.target.value}))} style={inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
                  <select value={newExp.cat} onChange={e=>setNewExp(p=>({...p,cat:e.target.value}))} style={inp}>
                    <option value="fijo">Fijo</option>
                    <option value="suscripcion">Suscripcion</option>
                    <option value="variable">Variable</option>
                  </select>
                  <input placeholder="Dia" type="number" value={newExp.dueDay} onChange={e=>setNewExp(p=>({...p,dueDay:parseInt(e.target.value)||1}))} style={inp} />
                </div>
                <input placeholder="Notas (opcional)" value={newExp.notes} onChange={e=>setNewExp(p=>({...p,notes:e.target.value}))} style={{...inp,marginBottom:10}} />
                <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                  {["current","next"].map(t => (
                    <button key={t} onClick={()=>setNewExp(p=>({...p,target:t}))} style={{ flex:1, padding:"9px", borderRadius:10, border:`1.5px solid ${newExp.target===t?C.primary:C.borderMid}`, background:newExp.target===t?C.primary+"22":"none", color:newExp.target===t?C.primary:C.textMid, cursor:"pointer", fontSize:13, fontFamily:C.font, fontWeight:"500" }}>
                      {t==="current"?"Este mes":"Proximo mes"}
                    </button>
                  ))}
                </div>
                <button onClick={addExp} style={{...btn(),width:"100%",padding:"12px",fontSize:15}}>
                  {newExp.target==="next" ? "Agregar al proximo mes" : "Guardar"}
                </button>
              </div>
            )}

            {CATS_SHOW.map(cat => {
              const list = expenses.filter(e=>e.cat===cat).sort((a,b)=>a.dueDay-b.dueDay);
              if (!list.length && cat!=="suscripcion") return null;
              const catTotal = list.reduce((a,e)=>a+e.amount,0);
              return (
                <div key={cat} style={{ marginBottom:24 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                    <span style={lbl}>{CAT_LABEL[cat]}</span>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <span style={{ fontSize:14, color:C.primary, fontWeight:"600" }}>{usd(catTotal)}</span>
                      {cat==="suscripcion" && (
                        <button onClick={() => {
                          const name=prompt("Nombre:"); if(!name) return;
                          const amount=parseFloat(prompt("Monto ($):")); if(!amount||isNaN(amount)) return;
                          const dueDay=Math.max(1,Math.min(31,parseInt(prompt("Dia de cobro:","1"))||1));
                          setExpenses(p=>[...p,{id:Date.now(),name,amount,cat:"suscripcion",dueDay,paid:false,abonado:0,notes:""}]);
                        }} style={{...btn(),padding:"5px 12px",fontSize:12}}>+ Sub</button>
                      )}
                    </div>
                  </div>
                  {list.length===0&&<div style={{ fontSize:13, color:C.textDim, padding:"10px 0", textAlign:"center" }}>Sin suscripciones</div>}
                  {list.map(e=><ExpRow key={e.id} e={e} cards={cards} onToggle={togglePaid} onAbono={openAbono} onDelete={delExp} onAmountSave={updExpAmount} onDaySave={updExpDay} C={C} />)}
                </div>
              );
            })}

            {/* Tarjetas desde Deudas */}
            <div style={{ marginBottom:24 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                <span style={lbl}>Tarjetas</span>
                <span style={{ fontSize:14, color:C.primary, fontWeight:"600" }}>{usd(cardExpTotal)}</span>
              </div>
              {cards.length===0 && <div style={{ fontSize:13, color:C.textDim, padding:"10px 0", textAlign:"center" }}>Agrega tarjetas en Deudas</div>}
              {[...cards].sort((a,b)=>a.dueDay-b.dueDay).map(c => {
                const abonado = c.abonado || (c.paid ? c.minPay : 0);
                const partial = abonado > 0 && abonado < c.minPay;
                const partPct = c.minPay > 0 ? Math.round((abonado/c.minPay)*100) : 0;
                return (
                  <div key={c.id} style={{ padding:"13px 0", borderBottom:`1px solid ${C.border}`, opacity:c.paid?0.4:1 }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:12, flex:1, minWidth:0 }}>
                        <button onClick={()=>toggleCardPaid(c.id)} style={{ width:24, height:24, borderRadius:7, flexShrink:0, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", border:c.paid?"none":partial?`2px solid ${C.warning}`:`2px solid ${c.color}`, background:c.paid?c.color:partial?C.warning+"22":"transparent" }}>
                          {c.paid && <span style={{ color:"#fff", fontSize:12, fontWeight:"700" }}>✓</span>}
                          {partial && !c.paid && <span style={{ color:C.warning, fontSize:12 }}>~</span>}
                        </button>
                        <div style={{ minWidth:0 }}>
                          <div style={{ fontSize:15, fontWeight:"500", color:C.text, textDecoration:c.paid?"line-through":"none" }}>{c.name}</div>
                          <div style={{ fontSize:12, color:C.textMid, marginTop:2 }}>Dia {c.dueDay}</div>
                        </div>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <div style={{ textAlign:"right" }}>
                          <div style={{ fontSize:16, fontWeight:"600", color:partial?C.warning:c.color }}>{usd(c.minPay)} <span style={{ fontSize:11, color:C.textDim }}>min</span></div>
                          {partial && <div style={{ fontSize:11, color:C.warning }}>+{usd(abonado)}</div>}
                        </div>
                        <button onClick={()=>{ setAbonoModal({id:c.id,name:c.name,amount:c.minPay,isCard:true}); setAbonoInput(String(c.abonado||"")); }} style={{ background:C.bgDeep, border:`1px solid ${C.borderMid}`, borderRadius:8, color:C.textMid, cursor:"pointer", fontSize:12, padding:"4px 9px" }}>$+</button>
                      </div>
                    </div>
                    {partial && <div style={{ marginTop:8, height:3, background:C.border, borderRadius:2, overflow:"hidden" }}><div style={{ height:"100%", width:`${partPct}%`, background:C.warning }} /></div>}
                  </div>
                );
              })}
            </div>

            {/* Salidas resumen en gastos */}
            <div style={{ marginBottom:24 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                <span style={lbl}>Salidas (presupuesto)</span>
                <span style={{ fontSize:14, fontWeight:"600", color:salidaDiff<0?C.negative:C.positive }}>{usd(salidaTotal)} / {usd(salidaBudget)}</span>
              </div>
              <div style={{ height:8, background:C.bgDeep, borderRadius:4, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${Math.min(100,(salidaTotal/salidaBudget)*100)}%`, background:salidaDiff<0?C.negative:C.warning, borderRadius:4, transition:"width .5s" }} />
              </div>
              <div style={{ fontSize:12, color:salidaDiff<0?C.negative:C.positive, marginTop:6, textAlign:"right" }}>
                {salidaDiff>=0 ? `Te quedan ${usd(salidaDiff)} del presupuesto` : `Excediste por ${usd(Math.abs(salidaDiff))}`}
              </div>
            </div>
          </div>
        )}

        {/* INGRESOS */}
        {tab==="ingresos" && (
          <div style={{ marginTop:20 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <span style={lbl}>Ingresos del mes</span>
              <button style={btn()} onClick={()=>setShowAddInc(!showAddInc)}>+ Agregar</button>
            </div>
            {showAddInc && (
              <div style={{ ...card, marginBottom:16 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
                  <input placeholder="Fuente" value={newInc.name} onChange={e=>setNewInc(p=>({...p,name:e.target.value}))} style={inp} />
                  <input placeholder="Monto $" type="number" value={newInc.amount} onChange={e=>setNewInc(p=>({...p,amount:e.target.value}))} style={inp} />
                </div>
                <input placeholder="Fecha (ej. 15 sep)" value={newInc.date} onChange={e=>setNewInc(p=>({...p,date:e.target.value}))} style={{...inp,marginBottom:10}} />
                <input placeholder="Notas" value={newInc.notes} onChange={e=>setNewInc(p=>({...p,notes:e.target.value}))} style={{...inp,marginBottom:12}} />
                <button onClick={addInc} style={{...btn(),width:"100%",padding:"12px",fontSize:15}}>Guardar</button>
              </div>
            )}
            {income.length===0&&!showAddInc&&(
              <div style={{ textAlign:"center", padding:"50px 0", color:C.textDim }}>
                <div style={{ fontSize:40, marginBottom:12 }}>💸</div>
                <div style={{ fontSize:16, color:C.textMid }}>Sin ingresos registrados</div>
              </div>
            )}
            {income.map(i=>(
              <div key={i.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"14px 0", borderBottom:`1px solid ${C.border}` }}>
                <div>
                  <div style={{ fontSize:16, color:C.positive, fontWeight:"600" }}>{i.name}</div>
                  <div style={{ fontSize:12, color:C.textMid, marginTop:2 }}>{i.date}{i.notes?` · ${i.notes}`:""}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:17, fontWeight:"700", color:C.positive }}>+{usd(i.amount)}</div>
                    <div style={{ fontSize:11, color:C.textDim }}>{cop(i.amount)}</div>
                  </div>
                  <button onClick={()=>delInc(i.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:22 }}>×</button>
                </div>
              </div>
            ))}
            {income.length>0&&(
              <div style={{ ...card, marginTop:16 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                  <span style={{ fontSize:14, color:C.textMid }}>Total ingresos</span>
                  <span style={{ fontSize:20, fontWeight:"700", color:C.positive }}>{usd(totalIncome)}</span>
                </div>
                <div style={{ display:"flex", justifyContent:"space-between" }}>
                  <span style={{ fontSize:13, color:C.textDim }}>vs. gastos totales</span>
                  <span style={{ fontSize:15, fontWeight:"600", color:totalIncome-totalExp>=0?C.positive:C.negative }}>
                    {totalIncome>=totalExp?"+":""}{usd(totalIncome-totalExp)}
                  </span>
                </div>
              </div>
            )}
          </div>
        )}

        {/* SALIDAS */}
        {tab==="salidas" && (
          <div style={{ marginTop:20 }}>
            {/* Presupuesto y resumen */}
            <div style={{ ...card, marginBottom:20 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                <div>
                  <div style={lbl}>Presupuesto mensual</div>
                  <div style={{ fontSize:28, fontWeight:"700", color:C.primary }}>$<Editable value={salidaBudget} onSave={setSalidaBudget} C={C} /></div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={lbl}>Gastado</div>
                  <div style={{ fontSize:28, fontWeight:"700", color:salidaDiff<0?C.negative:C.warning }}>{usd(salidaTotal)}</div>
                </div>
              </div>
              <div style={{ height:10, background:C.bgDeep, borderRadius:5, overflow:"hidden", marginBottom:10 }}>
                <div style={{ height:"100%", width:`${Math.min(100,(salidaTotal/salidaBudget)*100)}%`, background:salidaDiff<0?C.negative:C.warning, borderRadius:5, transition:"width .5s" }} />
              </div>
              <div style={{ ...card, background:salidaDiff<0?"#dc262618":"#05966918", border:`1px solid ${salidaDiff<0?C.negative:C.positive}`, textAlign:"center", padding:"14px" }}>
                {salidaDiff>=0 ? (
                  <div>
                    <div style={{ fontSize:22, fontWeight:"700", color:C.positive }}>+{usd(salidaDiff)}</div>
                    <div style={{ fontSize:13, color:C.positive, marginTop:4 }}>Te sobraron — ahorra, paga deuda, o disfruta</div>
                  </div>
                ) : (
                  <div>

                      <DonutChart data={data} size={160} thickness={32} />
                      <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
                        <div style={{ fontSize:10, color:netWorth>=0?C.positive:C.negative, letterSpacing:1, textTransform:"uppercase", fontWeight:"600" }}>{netWorth>=0?"Positivo":"Negativo"}</div>
                        <div style={{ fontSize:14, fontWeight:"700", color:netWorth>=0?C.positive:C.negative }}>{usd(netWorth)}</div>
                      </div>
                    </div>
                    <div style={{ flex:1 }}>
                      {data.map((c,i)=>(
                        <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                            <div style={{ width:8, height:8, borderRadius:"50%", background:c.color }} />
                            <span style={{ fontSize:13, color:C.text }}>{c.label}</span>
                          </div>
                          <div style={{ textAlign:"right" }}>
                            <div style={{ fontSize:13, color:c.color, fontWeight:"600" }}>{usd(c.value)}</div>
                            <div style={{ fontSize:11, color:C.textDim }}>{total>0?Math.round(c.value/total*100):0}%</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </div>
            {/* Evolucion de tarjetas */}
            {(()=>{
              const MAX_BAL = 5000;
              const toggleCard = id => setActiveCards(prev => {
                const all=cards.map(c=>c.id), current=prev||all;
                if (current.includes(id)) { const next=current.filter(x=>x!==id); return next.length===0?all:next; }
                return [...current,id];
              });
              const visibleIds = activeCards||cards.map(c=>c.id);
              const visibleCards = cards.filter(c=>visibleIds.includes(c.id));
              const allActive = activeCards===null||activeCards.length===cards.length;
              const pts=[...history].reverse();
              const labels=[...pts.map(h=>h.label.split(" ")[0].slice(0,3)),currentMonth.split(" ")[0].slice(0,3)+"*"];
              const nPts=labels.length;
              const W=300,H=130,padL=28,padR=8,padT=10,padB=16;
              const px=i=>padL+(nPts===1?(W-padL-padR)/2:(i/(nPts-1))*(W-padL-padR));
              const py=v=>padT+(1-(v/MAX_BAL))*(H-padT-padB);
              const gridVals=[0,1000,2000,3000,4000,5000];
              return (
                <div style={{ ...card, marginBottom:16 }}>
                  <div style={{ ...lbl, marginBottom:12 }}>Evolucion de tarjetas</div>
                  <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
                    <button onClick={()=>setActiveCards(null)} style={{ fontSize:12, padding:"6px 14px", borderRadius:20, border:`1.5px solid ${allActive?C.primary:C.borderMid}`, background:allActive?C.primary+"22":"none", color:allActive?C.primary:C.textMid, cursor:"pointer", fontFamily:C.font, fontWeight:"600" }}>Todas</button>
                    {cards.map(c=>{
                      const on=visibleIds.includes(c.id);
                      return <button key={c.id} onClick={()=>toggleCard(c.id)} style={{ fontSize:12, padding:"6px 14px", borderRadius:20, border:`1.5px solid ${on?c.color:C.borderMid}`, background:on?c.color+"22":"none", color:on?c.color:C.textMid, cursor:"pointer", fontFamily:C.font, fontWeight:on?"600":"400", opacity:on?1:0.5 }}>{c.name.split(" ")[0]}</button>;
                    })}
                  </div>
                  <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:150, overflow:"visible" }}>
                    {gridVals.map((v,i)=>{ const y=py(v); return <g key={i}><line x1={padL} y1={y} x2={W-padR} y2={y} stroke={C.border} strokeWidth={v===0?"1":"0.5"} strokeDasharray={v===0?"none":"3,3"}/><text x={padL-2} y={y+2} textAnchor="end" fontSize="5.5" fill={C.textDim}>${v===0?"0":v/1000+"k"}</text></g>; })}
                    {labels.map((l,i)=><text key={i} x={px(i)} y={H} textAnchor="middle" fontSize="6" fill={C.textDim}>{l}</text>)}
                    {visibleCards.map(card=>{
                      const cardPts=pts.map((h,i)=>{ const hc=h.cards?h.cards.find(c=>c.id===card.id):null; return hc?{x:px(i),y:py(Math.min(hc.balance,MAX_BAL)),v:hc.balance}:null; }).filter(Boolean);
                      cardPts.push({x:px(labels.length-1),y:py(Math.min(card.balance,MAX_BAL)),v:card.balance});
                      const dLine=cardPts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");
                      return <g key={card.id}>{cardPts.length>=2&&<path d={dLine} fill="none" stroke={card.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}{cardPts.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r={4} fill={card.color} stroke={C.bgCard} strokeWidth="1.5"/><text x={p.x} y={p.y-8} textAnchor="middle" fontSize="5.5" fill={card.color}>${Math.round(p.v/100)/10}k</text></g>)}</g>;
                    })}
                  </svg>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:12 }}>
                    {visibleCards.map(card=>{ const prev=history[0]?.cards?.find(c=>c.id===card.id); const diff=prev?card.balance-prev.balance:null; return <div key={card.id} style={{ background:C.bgDeep, borderRadius:10, padding:"10px 12px", borderLeft:`3px solid ${card.color}` }}><div style={{ fontSize:12, color:C.textMid, marginBottom:3 }}>{card.name.split(" ")[0]}</div><div style={{ fontSize:16, fontWeight:"700", color:card.color }}>{usd(card.balance)}</div>{diff!==null&&<div style={{ fontSize:11, color:diff<=0?C.positive:C.negative, marginTop:2 }}>{diff<=0?"-":"+"}${Math.abs(Math.round(diff))} vs ant.</div>}</div>; })}
                  </div>
                  <div style={{ fontSize:11, color:C.textDim, marginTop:8, textAlign:"right" }}>* mes actual · tope $5,000</div>
                </div>
              );
            })()}
          </div>
        )}

        {/* HISTORIAL */}
        {tab==="historial" && (
          <div style={{ marginTop:20 }}>
            <div style={{ ...card, marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:showNotes?12:0 }}>
                <span style={{ ...lbl, marginBottom:0 }}>Notas y mejoras</span>
                <button style={gbtn} onClick={()=>setShowNotes(!showNotes)}>{showNotes?"Cerrar":"Ver / Agregar"}</button>
              </div>
              {showNotes && (
                <div style={{ marginTop:12 }}>
                  <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                    <input placeholder="Escribe una nota o idea..." value={newNote} onChange={e=>setNewNote(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addAppNote(); }} style={{...inp,flex:1}} />
                    <button onClick={addAppNote} style={btn()}>+</button>
                  </div>
                  {appNotes.length===0&&<div style={{ fontSize:13, color:C.textDim, textAlign:"center", padding:"10px 0" }}>Sin notas aun</div>}
                  {appNotes.map(n=>(
                    <div key={n.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                      <div><div style={{ fontSize:14, color:C.text }}>{n.text}</div><div style={{ fontSize:11, color:C.textDim, marginTop:3 }}>{n.date}</div></div>
                      <button onClick={()=>delAppNote(n.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:22, flexShrink:0 }}>×</button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8 }}>
              <span style={lbl}>Historial mensual</span>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                <button onClick={()=>setShowImport(true)} style={sbtn}>Importar</button>
                <button onClick={exportData} style={gbtn}>Exportar</button>
                <button onClick={()=>setShowPlanner(!showPlanner)} style={gbtn}>Planear</button>
                <button onClick={()=>setConfirmClose(true)} style={btn()}>Cerrar mes</button>
              </div>
            </div>

            {showPlanner && (
              <div style={{ ...card, marginBottom:16, borderColor:C.positive }}>
                <div style={{ fontSize:11, color:C.positive, letterSpacing:2, textTransform:"uppercase", marginBottom:12, fontWeight:"600" }}>Planear proximo mes</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
                  <input placeholder="Nombre" value={newPlanItem.name} onChange={e=>setNewPlanItem(p=>({...p,name:e.target.value}))} style={inp} />
                  <input placeholder="Monto $" type="number" value={newPlanItem.amount} onChange={e=>setNewPlanItem(p=>({...p,amount:e.target.value}))} style={inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
                  <select value={newPlanItem.cat} onChange={e=>setNewPlanItem(p=>({...p,cat:e.target.value}))} style={inp}>
                    <option value="fijo">Fijo</option>
                    <option value="suscripcion">Suscripcion</option>
                    <option value="variable">Variable</option>
                  </select>
                  <input placeholder="Dia" type="number" value={newPlanItem.dueDay} onChange={e=>setNewPlanItem(p=>({...p,dueDay:parseInt(e.target.value)||1}))} style={inp} />
                </div>
                <input placeholder="Notas" value={newPlanItem.notes} onChange={e=>setNewPlanItem(p=>({...p,notes:e.target.value}))} style={{...inp,marginBottom:12}} />
                <button onClick={addPlanItem} style={{...btn(),width:"100%",padding:"12px",marginBottom:plannerItems.length>0?14:0}}>+ Agregar al plan</button>
                {plannerItems.length>0&&(
                  <div>
                    <div style={{ fontSize:11, color:C.textMid, letterSpacing:2, textTransform:"uppercase", marginBottom:10 }}>Cambios planeados</div>
                    {plannerItems.map((p,i)=>(
                      <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                        <div><div style={{ fontSize:14 }}>{p.name}</div><div style={{ fontSize:11, color:C.textDim, marginTop:2 }}>{p.cat} · dia {p.dueDay}</div></div>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}><span style={{ fontSize:15, color:C.positive, fontWeight:"600" }}>{usd(p.amount)}</span><button onClick={()=>delPlanItem(i)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:22 }}>×</button></div>
                      </div>
                    ))}
                    <div style={{ fontSize:12, color:C.positive, marginTop:10, textAlign:"center" }}>Se aplicaran al cerrar el mes</div>
                  </div>
                )}
              </div>
            )}

            {history.length===0&&<div style={{ textAlign:"center", padding:"50px 0", color:C.textDim }}><div style={{ fontSize:40, marginBottom:12 }}>📅</div><div style={{ fontSize:16, color:C.textMid }}>Sin meses cerrados aun</div></div>}
            {history.map(h=>(
              <div key={h.id} style={{ ...card, marginBottom:12, cursor:"pointer" }} onClick={()=>setHistDetail(histDetail?.id===h.id?null:h)}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div>
                    <div style={{ fontSize:17, fontWeight:"600" }}>{h.label}</div>
                    <div style={{ fontSize:12, color:C.textMid, marginTop:3 }}>Ingresos {usd(h.totalIncome)} · Gastos {usd(h.totalExp)}</div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:15, fontWeight:"700", color:h.totalIncome-h.totalExp>=0?C.positive:C.negative }}>{h.totalIncome-h.totalExp>=0?"+":""}{usd(h.totalIncome-h.totalExp)}</div>
                    <div style={{ fontSize:11, color:C.textDim }}>balance</div>
                  </div>
                </div>
                {histDetail?.id===h.id&&(
                  <div style={{ marginTop:14 }}>
                    <div style={{ height:1, background:C.border, marginBottom:14 }} />
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
                      {[{l:"Checking",v:h.checking,c:C.positive},{l:"Savings",v:h.savings,c:C.positive},{l:"Deuda tarjetas",v:h.cardDebt,c:C.negative},{l:"Deuda prestamos",v:h.loanDebt,c:C.negative},{l:"Patrimonio",v:h.netWorth,c:h.netWorth>=0?C.positive:C.negative},{l:"Pagado",v:h.totalPaid,c:C.primary}].map((s,i)=>(
                        <div key={i} style={{ background:C.bgDeep, borderRadius:10, padding:"10px 12px" }}>
                          <div style={{ fontSize:10, color:C.textDim, letterSpacing:1.5, textTransform:"uppercase", marginBottom:4 }}>{s.l}</div>
                          <div style={{ fontSize:14, fontWeight:"700", color:s.c }}>{usd(s.v)}</div>
                        </div>
                      ))}
                    </div>
                    {h.note&&<div style={{ fontSize:13, color:C.textMid, padding:"10px 12px", background:C.bgDeep, borderRadius:10, marginBottom:12 }}>{h.note}</div>}
                    {h.income&&h.income.length>0&&(
                      <div>
                        <div style={{ fontSize:11, color:C.textMid, letterSpacing:2, textTransform:"uppercase", marginBottom:10 }}>Ingresos</div>
                        {h.income.map((i,idx)=>(
                          <div key={idx} style={{ display:"flex", justifyContent:"space-between", fontSize:14, padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
                            <span style={{ color:C.textMid }}>{i.name}</span>
                            <span style={{ color:C.positive, fontWeight:"600" }}>+{usd(i.amount)}</span>
                          </div>
                        ))}
                        <div style={{ display:"flex", justifyContent:"space-between", fontSize:15, fontWeight:"700", paddingTop:10 }}>
                          <span style={{ color:C.textMid }}>Total</span>
                          <span style={{ color:C.positive }}>{usd(h.totalIncome)}</span>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            ))}
            {history.length>=2&&(
              <div style={{ ...card, marginTop:8 }}>
                <div style={{ ...lbl, color:C.positive, marginBottom:12 }}>Resumen anual</div>
                {[{l:"Total ingresos",v:history.reduce((a,h)=>a+h.totalIncome,0),c:C.positive},{l:"Total gastos",v:history.reduce((a,h)=>a+h.totalExp,0),c:C.primary},{l:"Balance neto",v:history.reduce((a,h)=>a+(h.totalIncome-h.totalExp),0),c:"#6366f1"}].map((r,i)=>(
                  <div key={i} style={{ display:"flex", justifyContent:"space-between", fontSize:14, padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                    <span style={{ color:C.textMid }}>{r.l}</span>
                    <span style={{ fontWeight:"700", color:r.c }}>{usd(r.v)}</span>
                  </div>
                ))}
                <div style={{ fontSize:12, color:C.textDim, marginTop:10, textAlign:"center" }}>Basado en {history.length} {history.length===1?"mes":"meses"} cerrados</div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, background:C.bgCard, borderTop:`1px solid ${C.border}`, padding:"10px 16px", textAlign:"center" }}>
        <div style={{ fontSize:11, color:C.textDim, letterSpacing:0.5 }}>Guardado automaticamente · Toca cualquier numero para editar</div>
      </div>

      {/* MODAL cerrar mes */}
      {confirmClose&&(
        <div style={modal}>
          <div style={mbox}>
            <div style={{ fontSize:11, letterSpacing:2, color:C.textMid, textTransform:"uppercase", marginBottom:10, fontWeight:"500" }}>Cerrar mes</div>
            <div style={{ fontSize:18, fontWeight:"700", marginBottom:10 }}>Guardar y empezar nuevo mes?</div>
            <div style={{ fontSize:14, color:C.textMid, marginBottom:16, lineHeight:1.6 }}>Los gastos fijos, tarjetas y suscripciones se reinician. Variables, ingresos y salidas se limpian.</div>
            <textarea value={closeNote} onChange={e=>setCloseNote(e.target.value)} placeholder="Nota del mes (opcional)..." rows={2} style={{ ...inp, marginBottom:16, resize:"none" }} />
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <button onClick={()=>setConfirmClose(false)} style={sbtn}>Cancelar</button>
              <button onClick={closeMonth} style={btn()}>Cerrar mes</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL abono */}
      {abonoModal&&(
        <div style={modal}>
          <div style={mbox}>
            <div style={{ fontSize:11, letterSpacing:2, color:C.textMid, textTransform:"uppercase", marginBottom:6, fontWeight:"500" }}>Registrar abono</div>
            <div style={{ fontSize:19, fontWeight:"700", marginBottom:4 }}>{abonoModal.name}</div>
            <div style={{ fontSize:14, color:C.textMid, marginBottom:16 }}>Total: {usd(abonoModal.amount)}</div>
            <input autoFocus type="number" placeholder={`Max. ${abonoModal.amount.toFixed(2)}`} value={abonoInput} onChange={e=>setAbonoInput(e.target.value)} style={{ ...inp, fontSize:18, marginBottom:16 }} />
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <button onClick={()=>setAbonoModal(null)} style={sbtn}>Cancelar</button>
              <button onClick={saveAbono} style={btn()}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL importar */}
      {showImport&&(
        <div style={modal}>
          <div style={{ ...mbox, maxWidth:380 }}>
            <div style={{ fontSize:11, letterSpacing:2, color:C.textMid, textTransform:"uppercase", marginBottom:8, fontWeight:"500" }}>Importar datos</div>
            <div style={{ fontSize:16, fontWeight:"700", marginBottom:6 }}>Pega el contenido del archivo</div>
            <div style={{ fontSize:13, color:C.textMid, marginBottom:14, lineHeight:1.6 }}>Abre el .json exportado, selecciona todo, copialo y pegalo aqui.</div>
            <textarea value={importText} onChange={e=>{setImportText(e.target.value);setImportError("");}} placeholder='{"checking":1351.96,...}' rows={5} style={{ ...inp, fontFamily:"monospace", fontSize:12, marginBottom:importError?8:16, resize:"none" }} />
            {importError&&<div style={{ fontSize:13, color:C.negative, marginBottom:14 }}>{importError}</div>}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <button onClick={()=>{setShowImport(false);setImportText("");setImportError("");}} style={sbtn}>Cancelar</button>
              <button onClick={importData} style={btn()}>Importar</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
