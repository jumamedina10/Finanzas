// ── Editable inline ────────────────────────────────────────────
function Editable({ value, onSave, color, type="number" }) {
  const clr = color || C.primary;
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  if (editing) return (
    <input autoFocus type={type} value={val}
      onChange={e => setVal(e.target.value)}
      onBlur={() => { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); }}
      onKeyDown={e => { if (e.key==="Enter") { onSave(type==="number" ? parseFloat(val)||0 : val); setEditing(false); } }}
      style={{ width:type==="text"?120:80, background:C.bgDeep, border:`1px solid ${C.primary}`, borderRadius:5, padding:"2px 6px", color:C.text, fontFamily:"inherit", fontSize:"inherit" }} />
  );
  return (
    <span onClick={() => { setVal(value); setEditing(true); }} style={{ cursor:"pointer", borderBottom:`1px dashed ${C.textDim}`, color:clr }}>
      {typeof value==="number" ? value.toFixed(2) : value}
    </span>
  );
}

// ── ExpRow ─────────────────────────────────────────────────────
function ExpRow({ e, cards, onToggle, onAbono, onDelete, onAmountSave, onDaySave }) {

// ── DonutChart ─────────────────────────────────────────────────
function DonutChart({ data, size=180, thickness=36 }) {
  const total = data.reduce((a,d)=>a+d.value,0);
  if (total===0) return null;
  const cx=size/2, cy=size/2, r=(size-thickness)/2;
  const circ = 2*Math.PI*r;
  let offset=0;
  const slices = data.map(d => {
    const dash=(d.value/total)*circ, gap=circ-dash;
    const s={...d,dash,gap,offset}; offset+=dash; return s;
  });
  return (
    <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
      {slices.map((s,i) => (
        <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={thickness}
          strokeDasharray={`${s.dash} ${s.gap}`} strokeDashoffset={-s.offset}
          style={{ transition:"stroke-dasharray .5s" }} />
      ))}
    </svg>
  );
}

// ── BarChart ────────────────────────────────────────────────────
function BarChart({ bars }) {
  const max = Math.max(...bars.map(b=>Math.max(b.a,b.b)), 1);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:8, height:120, padding:"0 4px" }}>
      {bars.map((b,i) => (
        <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
          <div style={{ width:"100%", display:"flex", gap:2, alignItems:"flex-end", height:100 }}>
            <div style={{ flex:1, background:C.positive, borderRadius:"3px 3px 0 0", height:`${(b.a/max)*100}%`, minHeight:b.a>0?2:0, transition:"height .5s" }} />
            <div style={{ flex:1, background:C.negative, borderRadius:"3px 3px 0 0", height:`${(b.b/max)*100}%`, minHeight:b.b>0?2:0, transition:"height .5s" }} />
          </div>
          <div style={{ fontSize:8, color:C.textDim, textAlign:"center" }}>{b.label}</div>
        </div>
      ))}
    </div>
  );
}

// ── LineChart ───────────────────────────────────────────────────
function LineChart({ points, color="#4361ee" }) {
  if (points.length < 2) return (
    <div style={{ textAlign:"center", padding:"30px 0", color:C.textDim, fontSize:11 }}>Necesitas al menos 2 meses cerrados</div>
  );
  const W=300, H=100, pad=10;
  const vals=points.map(p=>p.v), minV=Math.min(...vals), maxV=Math.max(...vals), range=maxV-minV||1;
  const px=i=>pad+(i/(points.length-1))*(W-pad*2);
  const py=v=>H-pad-((v-minV)/range)*(H-pad*2);
  const d=points.map((p,i)=>`${i===0?"M":"L"}${px(i)},${py(p.v)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:100, overflow:"visible" }}>
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={d+` L${px(points.length-1)},${H} L${px(0)},${H} Z`} fill="url(#lg)" />
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {points.map((p,i) => (
        <g key={i}>
          <circle cx={px(i)} cy={py(p.v)} r={3} fill={color} />
          <text x={px(i)} y={py(p.v)-8} textAnchor="middle" fontSize="7" fill={C.textMid}>{p.label}</text>
        </g>
      ))}
    </svg>
  );
}

    setCards(p=>[...p,{id:"card_"+Date.now(),name:newCard.name,color,limit:parseFloat(newCard.limit),balance:parseFloat(newCard.balance)||0,statBal:parseFloat(newCard.balance)||0,minPay:parseFloat(newCard.minPay)||0,dueDay:parseInt(newCard.dueDay)||1,cutDay:parseInt(newCard.cutDay)||0,notes:newCard.notes,paid:false,abonado:0}]);
    setNewCard({name:"",limit:"",balance:"",minPay:"",dueDay:1,cutDay:0,notes:""});
    setShowAddCard(false);
  };

  const addQuickSpend = () => {
    if (!newQuick.name||!newQuick.amount) return;
    const spend={id:Date.now(),name:newQuick.name,amount:parseFloat(newQuick.amount),method:newQuick.method,notes:newQuick.notes,date:new Date().toLocaleDateString("es",{day:"numeric",month:"short"})};
    setQuickSpends(p=>[spend,...p]);
    setNewQuick({name:"",amount:"",method:"debit",notes:""});
  };
  const delQuickSpend = id => setQuickSpends(p=>p.filter(s=>s.id!==id));

  const addAppNote = () => {
    if (!newNote.trim()) return;
    setAppNotes(p=>[{id:Date.now(),text:newNote.trim(),date:new Date().toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"})},...p]);
    setNewNote("");
  };
  const delAppNote = id => setAppNotes(p=>p.filter(n=>n.id!==id));

  const closeMonth = () => {
    const snap={id:Date.now(),label:currentMonth,checking,savings,totalIncome,totalExp,totalPaid,cardDebt,loanDebt,netWorth,note:closeNote,income:[...income],expenses:[...expenses],cards:[...cards],loans:[...loans]};
    setHistory(p=>[snap,...p]);
    const baseExp = expenses.filter(e=>e.cat!=="variable").map(e=>({...e,paid:false,abonado:0}));
    const plannerExp = plannerItems.map(p=>({...p,id:Date.now()+Math.random(),paid:false,abonado:0}));
    setExpenses([...baseExp,...plannerExp]);
    setCards(p=>p.map(c=>({...c,paid:false,abonado:0})));
    setPlannerItems([]); setIncome([]); setQuickSpends([]); setCloseNote("");
    const parts=currentMonth.split(" "), mIdx=MONTHS.indexOf(parts[0]), yr=parseInt(parts[1]);
    setCurrentMonth(`${MONTHS[mIdx===11?0:mIdx+1]} ${mIdx===11?yr+1:yr}`);
    setConfirmClose(false); setTab("gastos");
  };

  const exportData = () => {
    const blob=new Blob([JSON.stringify({checking,savings,cards,loans,expenses,income,history,currentMonth,quickSpends,appNotes})],{type:"application/json"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=`finanzas-${currentMonth.replace(" ","-")}.json`; a.click(); URL.revokeObjectURL(url);
  };

  const importData = () => {
    try {
      const data=JSON.parse(importText);
      if (!data.expenses||!data.cards) throw new Error();
      if (data.checking!==undefined) setChecking(data.checking);
      if (data.savings!==undefined) setSavings(data.savings);
      if (data.currentMonth!==undefined) setCurrentMonth(data.currentMonth);
      if (data.cards) setCards(data.cards);
      if (data.loans) setLoans(data.loans);
      if (data.expenses) setExpenses(data.expenses);
      if (data.income) setIncome(data.income);
      if (data.history) setHistory(data.history);
      if (data.quickSpends) setQuickSpends(data.quickSpends);
      if (data.appNotes) setAppNotes(data.appNotes);
      setShowImport(false); setImportText(""); setImportError("");
    } catch { setImportError("Archivo invalido. Copia el contenido completo del .json."); }
  };

  const S = {
    app:   { fontFamily:FONT, background:C.bg, minHeight:"100vh", color:C.text, maxWidth:480, margin:"0 auto", paddingBottom:90 },
    card:  { background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:14, padding:"14px" },
    inp:   { background:C.bg, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"8px 10px", color:C.text, fontFamily:FONT, fontSize:13, width:"100%", boxSizing:"border-box" },
    lbl:   { fontSize:9, letterSpacing:3.5, color:C.textMid, textTransform:"uppercase", marginBottom:6 },
    row:   { borderBottom:`1px solid ${C.border}` },
    modal: { position:"fixed", inset:0, background:"#000000cc", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:"0 24px" },
    mbox:  { background:"#0d1818", border:`1px solid ${C.borderMid}`, borderRadius:16, padding:"24px 20px", width:"100%", maxWidth:340 },
    tab:   a => ({ flex:1, padding:"11px 0", background:"none", border:"none", cursor:"pointer", fontSize:9, letterSpacing:1.5, textTransform:"uppercase", fontFamily:FONT, color:a?C.primary:C.textDim, borderBottom:a?`2px solid ${C.primary}`:"2px solid transparent" }),
    btn:   (bg,fg) => ({ background:bg||C.primary, border:"none", borderRadius:8, padding:"7px 14px", color:fg||C.bg, fontWeight:"bold", cursor:"pointer", fontSize:12, fontFamily:FONT }),
    sbtn:  { background:C.bgCard, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"7px 10px", color:C.textMid, cursor:"pointer", fontSize:11, fontFamily:FONT, fontWeight:"bold" },
    gbtn:  { background:C.bgCard, border:`1px solid ${C.primary}`, borderRadius:8, padding:"7px 10px", color:C.primary, cursor:"pointer", fontSize:11, fontFamily:FONT, fontWeight:"bold" },
    rbtn:  { background:"none", border:"none", color:C.negative, cursor:"pointer", fontSize:13, padding:"4px 8px", fontFamily:FONT },
  };

  const CATS = ["fijo","tarjeta","suscripcion","variable"];
  const CAT_LABEL = { fijo:"Gastos Fijos", tarjeta:"Tarjetas", suscripcion:"Suscripciones", variable:"Variables" };

  return (
    <div style={S.app}>

      {/* HEADER */}
      <div style={{ background:`linear-gradient(155deg,${C.bgCard} 0%,#0a1616 100%)`, borderBottom:`1px solid ${C.border}`, padding:"20px 18px 16px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <div style={{ fontSize:9, letterSpacing:3.5, color:C.textMid, textTransform:"uppercase", marginBottom:2 }}>
              <Editable value={currentMonth} onSave={setCurrentMonth} type="text" color={C.textMid} />
            </div>
            <div style={{ fontSize:20, fontWeight:"bold" }}>Hola, JuanMa</div>
          </div>
          <div style={{ display:"flex", gap:14, alignItems:"flex-start" }}>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:9, letterSpacing:2, color:C.textMid, textTransform:"uppercase" }}>Savings</div>
              <div style={{ fontSize:16, fontWeight:"bold", color:C.positive }}>$<Editable value={savings} onSave={setSavings} color={C.positive} /></div>
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:9, letterSpacing:2, color:C.textMid, textTransform:"uppercase" }}>Checking</div>
              <div style={{ fontSize:20, fontWeight:"bold", color:C.primary }}>$<Editable value={checking} onSave={setChecking} color={C.primary} /></div>
              <div style={{ fontSize:9, color:C.textDim, marginTop:1 }}>{cop(checking)}</div>
            </div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginTop:14 }}>
          {[
            {l:"Pagado",    v:usd(totalPaid),   c:C.positive},
            {l:"Pendiente", v:usd(totalPend),   c:totalPend>checking?C.negative:C.primary},
            {l:"Ingresos",  v:usd(totalIncome), c:"#7c6ed4"},
          ].map((k,i) => (
            <div key={i} style={{ background:C.bgDeep, borderRadius:10, padding:"9px 8px", border:`1px solid ${C.border}` }}>
              <div style={{ fontSize:8, letterSpacing:1.5, color:C.textDim, textTransform:"uppercase", marginBottom:3 }}>{k.l}</div>
              <div style={{ fontSize:13, fontWeight:"bold", color:k.c }}>{k.v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* TABS */}
      <div style={{ display:"flex", background:"#0a1212", borderBottom:`1px solid ${C.border}` }}>
        {[["gastos","Gastos"],["ingresos","Ingresos"],["deudas","Deudas"],["resumen","Resumen"],["graficas","Graficas"],["historial","Historial"]].map(([k,l]) => (
          <button key={k} style={S.tab(tab===k)} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>

      <div style={{ padding:"0 16px" }}>

        {/* GASTOS */}
        {tab==="gastos" && (
          <div style={{ marginTop:18 }}>
            <div style={{ ...S.card, marginBottom:18 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                <span style={S.lbl}>Progreso del mes</span>
                <span style={{ fontSize:11, color:C.primary }}>{totalExp>0?Math.round((totalPaid/totalExp)*100):0}%</span>
              </div>
              <div style={{ height:7, background:C.border, borderRadius:4, overflow:"hidden", marginBottom:10 }}>
                <div style={{ height:"100%", width:`${totalExp>0?(totalPaid/totalExp)*100:0}%`, background:`linear-gradient(90deg,${C.primary},${C.positive})`, borderRadius:4, transition:"width .5s" }} />
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6 }}>
                {[{l:"Total",v:usd(totalExp),c:C.text},{l:"Pagado",v:usd(totalPaid),c:C.positive},{l:"Pendiente",v:usd(totalPend),c:C.negative}].map((s,i) => (
                  <div key={i} style={{ background:C.bgDeep, borderRadius:8, padding:"8px 4px", textAlign:"center" }}>
                    <div style={{ fontSize:8, color:C.textDim, letterSpacing:1.5, textTransform:"uppercase" }}>{s.l}</div>
                    <div style={{ fontSize:12, fontWeight:"bold", color:s.c, marginTop:3 }}>{s.v}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div style={S.lbl}>Todos los gastos</div>
              <button style={S.btn()} onClick={()=>setShowAddExp(!showAddExp)}>+ Agregar</button>
            </div>

            {showAddExp && (
              <div style={{ ...S.card, marginBottom:14 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Nombre" value={newExp.name} onChange={e=>setNewExp(p=>({...p,name:e.target.value}))} style={S.inp} />
                  <input placeholder="Monto $" type="number" value={newExp.amount} onChange={e=>setNewExp(p=>({...p,amount:e.target.value}))} style={S.inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <select value={newExp.cat} onChange={e=>setNewExp(p=>({...p,cat:e.target.value}))} style={S.inp}>
                    <option value="fijo">Fijo</option>
                    <option value="suscripcion">Suscripcion</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="variable">Variable</option>
                  </select>
                  <input placeholder="Dia" type="number" value={newExp.dueDay} onChange={e=>setNewExp(p=>({...p,dueDay:parseInt(e.target.value)||1}))} style={S.inp} />
                </div>
                <input placeholder="Notas" value={newExp.notes} onChange={e=>setNewExp(p=>({...p,notes:e.target.value}))} style={{...S.inp,marginBottom:10}} />
                <button onClick={addExp} style={{...S.btn(),width:"100%",padding:"10px",fontSize:14}}>Guardar</button>
              </div>
            )}

            {/* Gastos fijos, suscripciones, variables */}
            {["fijo","suscripcion","variable"].map(cat => {
              const list = expenses.filter(e=>e.cat===cat).sort((a,b)=>a.dueDay-b.dueDay);
              if (!list.length && cat!=="suscripcion") return null;
              const catTotal = list.reduce((a,e)=>a+e.amount,0);
              const isSub = cat==="suscripcion";
              return (
                <div key={cat} style={{ marginBottom:22 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                    <div style={S.lbl}>{CAT_LABEL[cat]}</div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:12, color:C.primary }}>{usd(catTotal)}</span>
                      {isSub && (
                        <button onClick={() => {
                          const name=prompt("Nombre de la suscripcion:"); if(!name) return;
                          const amount=parseFloat(prompt("Monto mensual ($):")); if(!amount||isNaN(amount)) return;
                          const dueDay=Math.max(1,Math.min(31,parseInt(prompt("Dia de cobro (1-31):","1"))||1));
                          setExpenses(p=>[...p,{id:Date.now(),name,amount,cat:"suscripcion",dueDay,paid:false,abonado:0,notes:""}]);
                        }} style={{...S.btn(),padding:"4px 10px",fontSize:11}}>+ Sub</button>
                      )}
                    </div>
                  </div>
                  {list.length===0&&isSub&&(
                    <div style={{ fontSize:11, color:C.textDim, padding:"10px 0", textAlign:"center" }}>Sin suscripciones</div>
                  )}
                  {list.map(e=><ExpRow key={e.id} e={e} cards={cards} onToggle={togglePaid} onAbono={openAbono} onDelete={delExp} onAmountSave={updExpAmount} onDaySave={updExpDay} />)}
                </div>
              );
            })}

            {/* Tarjetas — siempre desde Deudas */}
            <div style={{ marginBottom:22 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                <div style={S.lbl}>Tarjetas</div>
                <span style={{ fontSize:12, color:C.primary }}>{usd(cardExpTotal)}</span>
              </div>
              {cards.length===0 && (
                <div style={{ fontSize:11, color:C.textDim, padding:"10px 0", textAlign:"center" }}>
                  Agrega tarjetas en la pestana Deudas
                </div>
              )}
              {[...cards].sort((a,b)=>a.dueDay-b.dueDay).map(c => {
                const abonado = c.abonado || (c.paid ? c.minPay : 0);
                const partial = abonado > 0 && abonado < c.minPay;
                const partPct = c.minPay > 0 ? Math.round((abonado/c.minPay)*100) : 0;
                return (
                  <div key={c.id} style={{ padding:"11px 0", borderBottom:`1px solid ${C.border}`, opacity:c.paid?0.35:1 }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <button onClick={()=>toggleCardPaid(c.id)} style={{
                          width:22, height:22, borderRadius:6, flexShrink:0, cursor:"pointer",
                          display:"flex", alignItems:"center", justifyContent:"center",
                          border: c.paid?"none": partial?`1.5px solid ${C.warning}`:`1.5px solid ${c.color}`,
                          background: c.paid?c.color: partial?C.warning+"22":"transparent"
                        }}>
                          {c.paid   && <span style={{ color:C.bg, fontSize:11, fontWeight:"bold" }}>v</span>}
                          {partial  && <span style={{ color:C.warning, fontSize:11, fontWeight:"bold" }}>~</span>}
                        </button>
                        <div>
                          <div style={{ fontSize:13, textDecoration:c.paid?"line-through":"none" }}>{c.name}</div>
                          <div style={{ fontSize:10, color:C.textDim }}>Dia {c.dueDay}{c.notes?` · ${c.notes}`:""}</div>
                        </div>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:7 }}>
                        <div style={{ textAlign:"right" }}>
                          <div style={{ fontSize:14, fontWeight:"bold", color:partial?C.warning:c.color }}>
                            {usd(c.minPay)}
                            <span style={{ fontSize:9, color:C.textDim, marginLeft:4 }}>min</span>
                          </div>
                          {partial && <div style={{ fontSize:9, color:C.warning }}>abonado {usd(abonado)}</div>}
                        </div>
                        <button onClick={()=>{ setAbonoModal({id:c.id,name:c.name,amount:c.minPay,isCard:true}); setAbonoInput(String(c.abonado||"")); }} style={{ background:C.bgCard, border:`1px solid ${C.borderMid}`, borderRadius:6, color:C.textMid, cursor:"pointer", fontSize:11, padding:"3px 7px" }}>$+</button>
                      </div>
                    </div>
                    {partial && (
                      <div style={{ marginTop:6, height:3, background:C.border, borderRadius:2, overflow:"hidden" }}>
                        <div style={{ height:"100%", width:`${partPct}%`, background:C.warning, borderRadius:2 }} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Gastos del dia */}
            <div style={{ marginBottom:22 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                <div style={S.lbl}>Gastos del dia</div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:12, color:C.primary }}>{usd(quickSpends.reduce((a,s)=>a+s.amount,0))}</span>
                  <button style={S.btn()} onClick={()=>setShowQuick(!showQuick)}>+ Gasto</button>
                </div>
              </div>
              {showQuick && (
                <div style={{ ...S.card, marginBottom:12, borderColor:C.primary }}>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                    <input placeholder="Que compraste" value={newQuick.name} onChange={e=>setNewQuick(p=>({...p,name:e.target.value}))} style={S.inp} />
                    <input placeholder="Monto $" type="number" value={newQuick.amount} onChange={e=>setNewQuick(p=>({...p,amount:e.target.value}))} style={S.inp} />
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                    <select value={newQuick.method} onChange={e=>setNewQuick(p=>({...p,method:e.target.value}))} style={S.inp}>
                      <option value="debit">Debito</option>
                      <option value="credit">Credito</option>
                      <option value="cash">Efectivo</option>
                    </select>
                    <input placeholder="Notas" value={newQuick.notes} onChange={e=>setNewQuick(p=>({...p,notes:e.target.value}))} style={S.inp} />
                  </div>
                  <button onClick={addQuickSpend} style={{...S.btn(),width:"100%",padding:"10px",fontSize:13}}>Registrar</button>
                </div>
              )}
              {quickSpends.length===0&&!showQuick&&(
                <div style={{ fontSize:11, color:C.textDim, padding:"12px 0", textAlign:"center" }}>Registra compras del dia</div>
              )}
              {quickSpends.length>0&&(
                <div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6, marginBottom:10 }}>
                    {[{label:"Debito",key:"debit",color:C.primary},{label:"Credito",key:"credit",color:C.negative},{label:"Efectivo",key:"cash",color:C.positive}].map(m=>{
                      const total=quickSpends.filter(s=>s.method===m.key).reduce((a,s)=>a+s.amount,0);
                      return (
                        <div key={m.key} style={{ background:C.bgDeep, borderRadius:8, padding:"8px 6px", textAlign:"center" }}>
                          <div style={{ fontSize:8, color:C.textDim, letterSpacing:1, textTransform:"uppercase" }}>{m.label}</div>
                          <div style={{ fontSize:12, fontWeight:"bold", color:total>0?m.color:C.textDim, marginTop:4 }}>{usd(total)}</div>
                        </div>
                      );
                    })}
                  </div>
                  {quickSpends.map(s=>{
                    const mc=s.method==="debit"?C.primary:s.method==="credit"?C.negative:C.positive;
                    const ml=s.method==="debit"?"Debito":s.method==="credit"?"Credito":"Efectivo";
                    return (
                      <div key={s.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                        <div>
                          <div style={{ fontSize:13 }}>{s.name}</div>
                          <div style={{ fontSize:10, color:C.textDim }}>{s.date} · {ml}{s.notes?` · ${s.notes}`:""}</div>
                        </div>
                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                          <div style={{ fontSize:14, fontWeight:"bold", color:mc }}>{usd(s.amount)}</div>
                          <button onClick={()=>delQuickSpend(s.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:18 }}>x</button>
                        </div>
                      </div>
                    );
                  })}
                  <div style={{ display:"flex", justifyContent:"space-between", paddingTop:10, fontSize:13, fontWeight:"bold" }}>
                    <span style={{ color:C.textMid }}>Total gastado</span>
                    <span style={{ color:C.primary }}>{usd(quickSpends.reduce((a,s)=>a+s.amount,0))}</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* INGRESOS */}
        {tab==="ingresos" && (
          <div style={{ marginTop:18 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={S.lbl}>Ingresos del mes</div>
              <button style={S.btn()} onClick={()=>setShowAddInc(!showAddInc)}>+ Agregar</button>
            </div>
            {showAddInc && (
              <div style={{ ...S.card, marginBottom:14 }}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                  <input placeholder="Fuente" value={newInc.name} onChange={e=>setNewInc(p=>({...p,name:e.target.value}))} style={S.inp} />
                  <input placeholder="Monto $" type="number" value={newInc.amount} onChange={e=>setNewInc(p=>({...p,amount:e.target.value}))} style={S.inp} />
                </div>
                <input placeholder="Fecha (ej. 15 ago)" value={newInc.date} onChange={e=>setNewInc(p=>({...p,date:e.target.value}))} style={{...S.inp,marginBottom:8}} />
                <input placeholder="Notas" value={newInc.notes} onChange={e=>setNewInc(p=>({...p,notes:e.target.value}))} style={{...S.inp,marginBottom:10}} />
                <button onClick={addInc} style={{...S.btn(),width:"100%",padding:"10px",fontSize:14}}>Guardar</button>
              </div>
            )}
            {income.length===0&&!showAddInc&&(
              <div style={{ textAlign:"center", padding:"50px 0", color:C.textDim }}>
                <div style={{ fontSize:36, marginBottom:12 }}>💸</div>
                <div style={{ fontSize:14 }}>Sin ingresos registrados</div>
              </div>
            )}
            {income.map(i=>(
              <div key={i.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"13px 0", ...S.row }}>
                <div>
                  <div style={{ fontSize:14, color:C.positive, fontWeight:"bold" }}>{i.name}</div>
                  <div style={{ fontSize:10, color:C.textDim }}>{i.date}{i.notes?` · ${i.notes}`:""}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:15, fontWeight:"bold", color:C.positive }}>+{usd(i.amount)}</div>
                    <div style={{ fontSize:9, color:C.textDim }}>{cop(i.amount)}</div>
                  </div>
                  <button onClick={()=>delInc(i.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:18 }}>x</button>
                </div>
              </div>
            ))}
            {income.length>0&&(
              <div style={{ ...S.card, marginTop:16 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                  <span style={{ fontSize:13, color:C.textMid }}>Total ingresos</span>
                  <span style={{ fontSize:18, fontWeight:"bold", color:C.positive }}>{usd(totalIncome)}</span>

            {(()=>{

              const toggleCard = id => {

                  const all = cards.map(c=>c.id);
                  const current = prev || all;
                  if (current.includes(id)) {
                    const next = current.filter(x=>x!==id);
                    return next.length===0 ? all : next;
                  } else {
                    return [...current, id];
                  }
                });
              };
              const toggleAll = () => setActiveCards(null);
              const allActive = activeCards===null || activeCards.length===cards.length;
              const visibleIds = activeCards || cards.map(c=>c.id);
              const visibleCards = cards.filter(c=>visibleIds.includes(c.id));

              const pts = [...history].reverse();
              const labels = [
                ...pts.map(h=>h.label.split(" ")[0].slice(0,3)),
                currentMonth.split(" ")[0].slice(0,3)+"*"
              ];
              const nPts = labels.length;
              const W=300, H=130, padL=28, padR=8, padT=10, padB=16;
              const px = i => padL + (nPts===1 ? (W-padL-padR)/2 : (i/(nPts-1))*(W-padL-padR));
              const py = v => padT + (1-(v/MAX_BAL))*(H-padT-padB);

              const gridVals = [0,1000,2000,3000,4000,5000];

              return (

                        <button key={c.id} onClick={()=>toggleCard(c.id)}

                          const y=py(v);
                          return (
                            <g key={i}>
                              <line x1={padL} y1={y} x2={W-padR} y2={y} stroke={C.border} strokeWidth={v===0?"1":"0.5"} strokeDasharray={v===0?"none":"3,3"} />
                              <text x={padL-2} y={y+2} textAnchor="end" fontSize="5.5" fill={C.textDim}>${v===0?"0":v/1000+"k"}</text>
                            </g>
                          );
                        })}
                        {/* X labels */}
                        {labels.map((l,i)=>(
                          <text key={i} x={px(i)} y={H} textAnchor="middle" fontSize="6" fill={C.textDim}>{l}</text>
                        ))}
                        {/* Lineas por tarjeta */}
                        {visibleCards.map(card=>{
                          const cardPts = pts.map((h,i)=>{
                            const hc = h.cards ? h.cards.find(c=>c.id===card.id) : null;
                            return hc ? {x:px(i), y:py(Math.min(hc.balance,MAX_BAL)), v:hc.balance} : null;
                          }).filter(Boolean);
                          cardPts.push({x:px(labels.length-1), y:py(Math.min(card.balance,MAX_BAL)), v:card.balance});
                          const dLine = cardPts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");
                          return (
                            <g key={card.id}>
                              {cardPts.length >= 2 && (
                                <path d={dLine} fill="none" stroke={card.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                              )}
                              {cardPts.map((p,i)=>(
                                <g key={i}>
                                  <circle cx={p.x} cy={p.y} r={4} fill={card.color} stroke={C.bgCard} strokeWidth="1.5"/>
                                  <text x={p.x} y={p.y-8} textAnchor="middle" fontSize="5.5" fill={card.color}>${Math.round(p.v/100)/10}k</text>
                                </g>
                              ))}
                            </g>
                          );
                        })}
                      </svg>

                      {/* Leyenda */}
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginTop:10 }}>
                        {visibleCards.map(card=>{
                          const prev = history[0]?.cards?.find(c=>c.id===card.id);
                          const diff = prev ? card.balance - prev.balance : null;
                          return (
                            <div key={card.id} style={{ background:C.bgDeep, borderRadius:8, padding:"8px 10px", borderLeft:`3px solid ${card.color}` }}>
                              <div style={{ fontSize:10, color:C.textMid, marginBottom:2 }}>{card.name.split(" ")[0]}</div>
                              <div style={{ fontSize:14, fontWeight:"bold", color:card.color }}>{usd(card.balance)}</div>
                              {diff!==null&&(
                                <div style={{ fontSize:9, color:diff<=0?C.positive:C.negative, marginTop:2 }}>
                                  {diff<=0?"-":"+"}${Math.abs(Math.round(diff))} vs mes ant.
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                      {history.length===0 && (
                        <div style={{ fontSize:9, color:C.textDim, marginTop:8, textAlign:"center" }}>
                          Cierra tu primer mes para ver la evolucion en el tiempo
                        </div>
                      )}
                      <div style={{ fontSize:9, color:C.textDim, marginTop:4, textAlign:"right" }}>* mes actual · tope $5,000</div>
                    </div>
                </div>
              );
            })()}
          </div>
        )}

        {/* HISTORIAL */}
        {tab==="historial" && (
          <div style={{ marginTop:18 }}>

            {/* Notas de la app */}
            <div style={{ ...S.card, marginBottom:16, borderColor:"#2a2a1a" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:showNotes?10:0 }}>
                <div style={{ ...S.lbl, marginBottom:0 }}>Notas y mejoras pendientes</div>
                <button style={S.gbtn} onClick={()=>setShowNotes(!showNotes)}>{showNotes?"Cerrar":"Ver / Agregar"}</button>
              </div>
              {showNotes && (
                <div>
                  <div style={{ display:"flex", gap:8, marginTop:10, marginBottom:10 }}>
                    <input placeholder="Escribe una nota o idea..." value={newNote} onChange={e=>setNewNote(e.target.value)}
                      onKeyDown={e=>{ if(e.key==="Enter") addAppNote(); }}
                      style={{...S.inp, flex:1}} />
                    <button onClick={addAppNote} style={S.btn()}>+</button>
                  </div>
                  {appNotes.length===0&&(
                    <div style={{ fontSize:11, color:C.textDim, textAlign:"center", padding:"10px 0" }}>Sin notas aun</div>
                  )}
                  {appNotes.map(n=>(
                    <div key={n.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
                      <div>
                        <div style={{ fontSize:13 }}>{n.text}</div>
                        <div style={{ fontSize:9, color:C.textDim, marginTop:2 }}>{n.date}</div>
                      </div>
                      <button onClick={()=>delAppNote(n.id)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:18, flexShrink:0 }}>x</button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:8 }}>
              <div style={S.lbl}>Historial mensual</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                <button onClick={()=>setShowImport(true)} style={S.sbtn}>Importar</button>
                <button onClick={exportData} style={S.gbtn}>Exportar</button>
                <button onClick={()=>setShowPlanner(!showPlanner)} style={S.gbtn}>Planear</button>
                <button onClick={()=>setConfirmClose(true)} style={S.gbtn}>Cerrar mes</button>
              </div>
            </div>

            {showPlanner && (
              <div style={{ ...S.card, marginBottom:16, borderColor:"#2a3a1a" }}>
                <div style={{ fontSize:9, color:C.positive, letterSpacing:3, textTransform:"uppercase", marginBottom:10 }}>Planear proximo mes</div>
                <div style={{ fontSize:11, color:C.textDim, marginBottom:12 }}>Gastos nuevos que entraran al cerrar el mes</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:6 }}>
                  <input placeholder="Nombre" value={newPlanItem.name} onChange={e=>setNewPlanItem(p=>({...p,name:e.target.value}))} style={S.inp} />
                  <input placeholder="Monto $" type="number" value={newPlanItem.amount} onChange={e=>setNewPlanItem(p=>({...p,amount:e.target.value}))} style={S.inp} />
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:6 }}>
                  <select value={newPlanItem.cat} onChange={e=>setNewPlanItem(p=>({...p,cat:e.target.value}))} style={S.inp}>
                    <option value="fijo">Fijo</option>
                    <option value="suscripcion">Suscripcion</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="variable">Variable</option>
                  </select>
                  <input placeholder="Dia" type="number" value={newPlanItem.dueDay} onChange={e=>setNewPlanItem(p=>({...p,dueDay:parseInt(e.target.value)||1}))} style={S.inp} />
                </div>
                <input placeholder="Notas" value={newPlanItem.notes} onChange={e=>setNewPlanItem(p=>({...p,notes:e.target.value}))} style={{...S.inp,marginBottom:8}} />
                <button onClick={addPlanItem} style={{...S.btn(),width:"100%",padding:"9px",marginBottom:plannerItems.length>0?12:0}}>+ Agregar al plan</button>
                {plannerItems.length>0&&(
                  <div>
                    <div style={{ fontSize:9, color:C.textMid, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>Cambios planeados</div>
                    {plannerItems.map((p,i)=>(
                      <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 0", borderBottom:`1px solid ${C.border}` }}>
                        <div>
                          <div style={{ fontSize:12 }}>{p.name}</div>
                          <div style={{ fontSize:9, color:C.textDim }}>{p.cat} · dia {p.dueDay}</div>
                        </div>
                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                          <span style={{ fontSize:13, color:C.positive }}>{usd(p.amount)}</span>
                          <button onClick={()=>delPlanItem(i)} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:18 }}>x</button>
                        </div>
                      </div>
                    ))}
                    <div style={{ fontSize:10, color:C.positive, marginTop:8, textAlign:"center" }}>Se aplicaran al cerrar el mes</div>
                  </div>
                )}
              </div>
            )}

            {history.length===0&&(
              <div style={{ textAlign:"center", padding:"50px 0", color:C.textDim }}>
                <div style={{ fontSize:32, marginBottom:12 }}>📅</div>
                <div style={{ fontSize:14 }}>Sin meses cerrados aun</div>
              </div>
            )}
            {history.map(h=>(
              <div key={h.id} style={{ ...S.card, marginBottom:12, cursor:"pointer" }} onClick={()=>setHistDetail(histDetail?.id===h.id?null:h)}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div>
                    <div style={{ fontSize:15, fontWeight:"bold" }}>{h.label}</div>
                    <div style={{ fontSize:10, color:C.textDim, marginTop:2 }}>Ingresos {usd(h.totalIncome)} · Gastos {usd(h.totalExp)}</div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:13, fontWeight:"bold", color:h.totalIncome-h.totalExp>=0?C.positive:C.negative }}>
                      {h.totalIncome-h.totalExp>=0?"+":""}{usd(h.totalIncome-h.totalExp)}
                    </div>
                    <div style={{ fontSize:9, color:C.textDim }}>balance</div>
                  </div>
                </div>
                {histDetail?.id===h.id&&(
                  <div style={{ marginTop:12 }}>
                    <div style={{ height:1, background:C.border, marginBottom:12 }} />
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:10 }}>
                      {[
                        {l:"Checking",        v:h.checking,  c:C.positive},
                        {l:"Savings",         v:h.savings,   c:C.positive},
                        {l:"Deuda tarjetas",  v:h.cardDebt,  c:C.negative},
                        {l:"Deuda prestamos", v:h.loanDebt,  c:C.negative},
                        {l:"Patrimonio",      v:h.netWorth,  c:h.netWorth>=0?C.positive:C.negative},
                        {l:"Pagado",          v:h.totalPaid, c:C.primary},
                      ].map((s,i)=>(
                        <div key={i} style={{ background:C.bgDeep, borderRadius:8, padding:"8px 10px" }}>
                          <div style={{ fontSize:8, color:C.textDim, letterSpacing:1.5, textTransform:"uppercase", marginBottom:3 }}>{s.l}</div>
                          <div style={{ fontSize:13, fontWeight:"bold", color:s.c }}>{usd(s.v)}</div>
                        </div>
                      ))}
                    </div>
                    {h.note&&<div style={{ fontSize:11, color:C.textMid, padding:"8px 10px", background:C.bgDeep, borderRadius:8, marginBottom:8 }}>{h.note}</div>}
                    {h.income&&h.income.length>0&&(
                      <div>
                        <div style={{ fontSize:9, color:C.textMid, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>Ingresos</div>
                        {h.income.map((i,idx)=>(
                          <div key={idx} style={{ display:"flex", justifyContent:"space-between", fontSize:12, padding:"5px 0", borderBottom:`1px solid ${C.border}` }}>
                            <span style={{ color:C.textMid }}>{i.name}</span>
                            <span style={{ color:C.positive }}>+{usd(i.amount)}</span>
                          </div>
                        ))}
                        <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, fontWeight:"bold", paddingTop:8 }}>
                          <span style={{ color:C.textMid }}>Total ingresos</span>
                          <span style={{ color:C.positive }}>{usd(h.totalIncome)}</span>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            ))}
            {history.length>=2&&(
              <div style={{ ...S.card, marginTop:8 }}>
                <div style={{ ...S.lbl, color:C.positive, marginBottom:10 }}>Resumen anual</div>
                {[
                  {l:"Total ingresos", v:history.reduce((a,h)=>a+h.totalIncome,0), c:C.positive},
                  {l:"Total gastos",   v:history.reduce((a,h)=>a+h.totalExp,0),    c:C.primary},
                  {l:"Balance neto",   v:history.reduce((a,h)=>a+(h.totalIncome-h.totalExp),0), c:"#4361ee"},
                ].map((r,i)=>(
                  <div key={i} style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"7px 0", borderBottom:`1px solid ${C.border}` }}>
                    <span style={{ color:C.textMid }}>{r.l}</span>
                    <span style={{ fontWeight:"bold", color:r.c }}>{usd(r.v)}</span>
                  </div>
                ))}
                <div style={{ fontSize:10, color:C.textDim, marginTop:8, textAlign:"center" }}>
                  Basado en {history.length} {history.length===1?"mes":"meses"} cerrados
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, background:C.bg, borderTop:`1px solid ${C.border}`, padding:"8px 16px", textAlign:"center" }}>
        <div style={{ fontSize:9, color:C.textDim, letterSpacing:1 }}>Guardado automaticamente · Toca cualquier numero para editar</div>
      </div>

      {/* MODAL cerrar mes */}
      {confirmClose&&(
        <div style={S.modal}>
          <div style={S.mbox}>
            <div style={{ fontSize:9, letterSpacing:3, color:C.textMid, textTransform:"uppercase", marginBottom:8 }}>Cerrar mes</div>
            <div style={{ fontSize:16, fontWeight:"bold", marginBottom:8 }}>Guardar y empezar nuevo mes?</div>
            <div style={{ fontSize:12, color:C.textMid, marginBottom:14, lineHeight:1.6 }}>
              Los gastos fijos, tarjetas y suscripciones se reinician. Los variables e ingresos se limpian.
            </div>
            <div style={{ marginBottom:10 }}>
              <textarea value={closeNote} onChange={e=>setCloseNote(e.target.value)}
                placeholder="Nota del mes (opcional)..."
                rows={2} style={{ background:C.bg, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"8px 10px", color:C.text, fontFamily:FONT, fontSize:12, width:"100%", boxSizing:"border-box", resize:"none" }} />
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <button onClick={()=>setConfirmClose(false)} style={{ background:C.bgCard, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"11px", color:C.textMid, cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Cancelar</button>
              <button onClick={closeMonth} style={{ background:C.primary, border:"none", borderRadius:8, padding:"11px", color:C.bg, fontWeight:"bold", cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Cerrar mes</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL abono */}
      {abonoModal&&(
        <div style={S.modal}>
          <div style={S.mbox}>
            <div style={{ fontSize:9, letterSpacing:3, color:C.textMid, textTransform:"uppercase", marginBottom:4 }}>Registrar abono</div>
            <div style={{ fontSize:17, fontWeight:"bold", marginBottom:4 }}>{abonoModal.name}</div>
            <div style={{ fontSize:11, color:C.textMid, marginBottom:16 }}>Total: {usd(abonoModal.amount)}</div>
            <input autoFocus type="number" placeholder={`Max. ${abonoModal.amount.toFixed(2)}`}
              value={abonoInput} onChange={e=>setAbonoInput(e.target.value)}
              style={{ background:C.bg, border:`1px solid ${C.primary}`, borderRadius:8, padding:"10px 12px", color:C.text, fontFamily:FONT, fontSize:16, width:"100%", boxSizing:"border-box", marginBottom:14 }} />
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <button onClick={()=>setAbonoModal(null)} style={{ background:C.bgCard, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"10px", color:C.textMid, cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Cancelar</button>
              <button onClick={saveAbono} style={{ background:C.primary, border:"none", borderRadius:8, padding:"10px", color:C.bg, fontWeight:"bold", cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL importar */}
      {showImport&&(
        <div style={S.modal}>
          <div style={{ ...S.mbox, maxWidth:380 }}>
            <div style={{ fontSize:9, letterSpacing:3, color:C.textMid, textTransform:"uppercase", marginBottom:6 }}>Importar datos</div>
            <div style={{ fontSize:14, fontWeight:"bold", marginBottom:6 }}>Pega el contenido del archivo</div>
            <div style={{ fontSize:11, color:C.textMid, marginBottom:14, lineHeight:1.6 }}>
              Abre el .json exportado, selecciona todo, copialo y pegalo aqui.
            </div>
            <textarea value={importText} onChange={e=>{setImportText(e.target.value);setImportError("");}}
              placeholder='{"checking":1351.96,...}' rows={5}
              style={{ background:C.bg, border:`1px solid ${importError?C.negative:C.borderMid}`, borderRadius:8, padding:"10px 12px", color:C.text, fontFamily:"monospace", fontSize:11, width:"100%", boxSizing:"border-box", marginBottom:importError?6:14, resize:"none" }} />
            {importError&&<div style={{ fontSize:11, color:C.negative, marginBottom:12 }}>{importError}</div>}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <button onClick={()=>{setShowImport(false);setImportText("");setImportError("");}} style={{ background:C.bgCard, border:`1px solid ${C.borderMid}`, borderRadius:8, padding:"10px", color:C.textMid, cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Cancelar</button>
              <button onClick={importData} style={{ background:C.primary, border:"none", borderRadius:8, padding:"10px", color:C.bg, fontWeight:"bold", cursor:"pointer", fontFamily:FONT, fontSize:13 }}>Importar</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
